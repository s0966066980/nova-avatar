name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint, integration check, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # Full history so the changed files can be diffed against the previous
          # push or the pull request's base.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.21'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Install development and offline-check dependencies
        # uv's pip backend selects CPU wheels only for PyTorch packages.
        # --no-sources skips path sources, so the contracts, the core and the
        # processing layers are named here.
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python --no-sources --torch-backend cpu --group dev --group ci -e ./contracts -e './core[vad]' -e ./services/stt -e ./services/llm -e ./services/tts -e ./avatar -e .
      - name: Lint Python
        run: uv run --no-sync ruff check .
      - name: Type-check server control flow
        run: uv run --no-sync pyright
      - name: Check processing-layer import boundaries
        run: uv run --no-sync lint-imports
      - name: Check committed OpenAPI documents match the contracts
        run: uv run --no-sync python scripts/generate_openapi.py --check
      - name: Check branding, notices, and offline integration
        run: uv run --no-sync python scripts/check-integration.py
      - name: Select the tests of the changed layers
        # Lint, types, import boundaries, OpenAPI, the integration check and the
        # lock always run. Only the layers' own tests are skipped, and only when
        # the diff stays inside other layers; see scripts/ci_select_tests.py.
        # Anything unknown, any failure to diff, and workflow_dispatch run all.
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT" = "pull_request" ]; then
            base="HEAD^1"
          elif [ "$EVENT" = "push" ]; then
            base="$BEFORE"
          fi
          if [ -n "$base" ]; then
            uv run --no-sync python scripts/ci_select_tests.py --base "$base" >> "$GITHUB_OUTPUT"
          else
            uv run --no-sync python scripts/ci_select_tests.py >> "$GITHUB_OUTPUT"
          fi
      - name: Run Python tests
        env:
          PYTEST_ARGS: ${{ steps.select.outputs.pytest_args }}
        # Empty PYTEST_ARGS is plain pytest, which collects pyproject's testpaths.
        run: uv run --no-sync pytest $PYTEST_ARGS

  web:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit production dependencies (advisory)
        run: npm audit --omit=dev
        continue-on-error: true
      - name: Lint frontend
        run: npm run lint
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
