name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint, integration check, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.21'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Install development and offline-check dependencies
        # uv's pip backend selects CPU wheels only for PyTorch packages.
        # --no-sources ignores the path sources, so every workspace package is
        # named here; the root project then finds them already installed.
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python --no-sources --torch-backend cpu --group dev --group ci -e ./contracts -e ./core -e ./avatar -e ./services/stt -e ./services/llm -e ./services/tts -e '.[vad]'
      - name: Lint Python
        run: uv run --no-sync ruff check .
      - name: Type-check server control flow
        run: uv run --no-sync pyright
      - name: Check processing-layer import boundaries
        run: uv run --no-sync lint-imports
      - name: Check contracts OpenAPI matches the models
        run: uv run --no-sync python scripts/generate-openapi.py --check
      - name: Check branding, notices, and offline integration
        run: uv run --no-sync python scripts/check-integration.py
      - name: Select the tests this change can affect
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        # Lint, import boundaries, OpenAPI and the integration check above run
        # every time; only the test suites are narrowed (scripts/select-tests.py).
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            paths=all
          else
            paths=$(git diff --name-only "$BASE_SHA" HEAD | python3 scripts/select-tests.py)
          fi
          echo "Selected tests: $paths"
          echo "paths=$paths" >> "$GITHUB_OUTPUT"
      - name: Run Python tests
        if: steps.select.outputs.paths != 'none'
        env:
          PATHS: ${{ steps.select.outputs.paths }}
        run: |
          if [ "$PATHS" = all ]; then
            uv run --no-sync pytest
          else
            uv run --no-sync pytest $PATHS
          fi

  web:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit production dependencies (advisory)
        run: npm audit --omit=dev
        continue-on-error: true
      - name: Lint frontend
        run: npm run lint
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
