<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Nova Avatar 數位人舞台">
<title>數位人舞台 · Nova Avatar</title>
<style>
.stage-language{position:absolute;right:12px;top:12px;z-index:6;display:flex;flex-direction:column;gap:4px;max-width:45%}.stage-language select{min-height:44px;background:#121b2b;color:#fff;border:1px solid #64748b;border-radius:8px;padding:8px}.stage-language-status{font-size:12px}.entry-languages{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  :root{
    --bg:#08090c;
    --stage-shadow: 0 40px 120px -20px rgba(0,0,0,.9);
    --ink:#f4f6fa;
    --ink-dim:rgba(244,246,250,.55);
    --idle:#8fa3bf;
    --hear:#3ddc97;
    --think:#f2b544;
    --speak:#7c9cff;
    --halt:#6b7280;
    --bad:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",Segoe UI,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* 深色場地 + 極淡徑向光暈，把視線收斂到中央舞台 */
  .room{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse 60% 55% at 50% 42%, rgba(124,156,255,.10), transparent 70%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(61,220,151,.05), transparent 70%);
  }

  /* 9:16 舞台：高度吃滿可用空間，寬度由比例決定 */
  .stage{
    position:relative;
    height:min(100vh - 32px, 100vh);
    aspect-ratio:9/16;
    max-width:calc(100vw - 32px);
    border-radius:20px;
    overflow:hidden;
    background:#000;
    box-shadow:var(--stage-shadow);
    isolation:isolate;
  }
  .stage video{
    width:100%; height:100%;
    object-fit:cover;      /* 各角色原始比例不一，統一裁切成 9:16 */
    display:block;
    background:#000;
  }
  /* 下緣微淡漸層，配合半透明毛玻璃回覆框，兼顧透視感與清晰度 */
  .stage::after{
    content:""; position:absolute; inset:auto 0 0 0; height:32%;
    background:linear-gradient(to top, rgba(4,5,8,.75) 0%, rgba(4,5,8,.25) 55%, transparent 100%);
    pointer-events:none; z-index:1;
  }

  /* ── 中央收音按鈕 ─────────────────────────── */
  .mic-wrap{
    /* 臉部框底端在畫面 49.2%、嘴巴約 43.8%，按鈕中心壓到 62% 才不會擋住對嘴 */
    position:absolute; top:62%; left:50%;
    transform:translate(-50%,-50%);
    z-index:3;
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .mic{
    position:relative;
    width:104px; height:104px;
    border-radius:50%;
    border:1.5px solid rgba(255,255,255,.30);
    background:rgba(12,15,22,.62);
    color:var(--ink);
    cursor:pointer;
    display:grid; place-items:center;
    transition:transform .18s cubic-bezier(.2,.8,.3,1), background .25s, border-color .25s, opacity .25s;
    touch-action:none;
    -webkit-tap-highlight-color:transparent;
  }
  .mic:disabled{opacity:.35; cursor:not-allowed}
  .mic:active:not(:disabled){transform:scale(.94)}
  .mic svg{width:38px;height:38px;fill:currentColor;pointer-events:none}

  /* 呼吸光環：顏色就是狀態語言，不用文字狀態列 */
  .ring{
    position:absolute; inset:-14px;
    border-radius:50%;
    border:2px solid var(--ring, var(--idle));
    opacity:.5;
    pointer-events:none;
    will-change:transform,opacity;
    animation:breathe var(--ring-speed,3.4s) ease-in-out infinite;
  }
  .ring.b{inset:-26px; opacity:.22; animation-delay:-1.1s}
  @keyframes breathe{
    0%,100%{transform:scale(.94); opacity:.18}
    50%    {transform:scale(1.06); opacity:.55}
  }
  .mic-hint{
    font-size:12.5px; letter-spacing:.06em;
    color:rgba(255,255,255,.78);
    background:rgba(8,10,14,.68);
    padding:5px 12px; border-radius:999px;
    white-space:nowrap;
    transition:opacity .25s;
  }

  /* 狀態配色 */
  .stage[data-voice="idle"]      .mic-wrap{--ring:var(--idle)}
  .stage[data-voice="hearing"]   .mic-wrap{--ring:var(--hear); --ring-speed:1.2s}
  .stage[data-voice="thinking"]  .mic-wrap{--ring:var(--think); --ring-speed:1.8s}
  .stage[data-voice="speaking"]  .mic-wrap{--ring:var(--speak); --ring-speed:2.2s}
  .stage[data-voice="paused"]    .mic-wrap{--ring:var(--halt); --ring-speed:5s}
  .stage[data-voice="hearing"] .mic{background:rgba(61,220,151,.16); border-color:rgba(61,220,151,.5)}
  .stage[data-voice="speaking"] .mic{opacity:.42}
  .stage[data-voice="speaking"] .mic:hover{opacity:1}

  /* ── 字幕（正中間下方）───────────────────── */
  .captions{
    position:absolute; left:50%; top:90%; width:100%;
    transform:translate(-50%,-50%);
    z-index:2;
    padding:0 20px 28px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    pointer-events:none; text-align:center;
  }
  .said{
    font-size:12.5px; line-height:1.5;
    color:var(--ink-dim);
    max-width:92%;
    opacity:0; transform:translateY(6px);
    transition:opacity .3s, transform .3s;
    background:rgba(8,10,16,.55);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    padding:4px 14px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.08);
  }
  .said.on{opacity:1; transform:none}
  .said::before{content:"「"} .said::after{content:"」"}
  .reply-wrap{
    position:relative;
    width:100%;
    max-width:100%;
    display:flex;
    justify-content:center;
    opacity:0;
    transform:translateY(10px);
    transition:opacity .35s cubic-bezier(.2,.8,.3,1), transform .35s cubic-bezier(.2,.8,.3,1);
    background:rgba(10,14,24,.65);
    backdrop-filter:blur(16px) saturate(160%);
    -webkit-backdrop-filter:blur(16px) saturate(160%);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 14px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.10);
    border-radius:18px;
    padding:16px 20px;
    pointer-events:none;
  }
  .reply-wrap:has(.reply.on),
  .reply-wrap.on{
    opacity:1;
    transform:none;
  }
  .reply{
    font-size:clamp(16px, 2.2vh, 21px);
    line-height:1.62;
    font-weight:500;
    letter-spacing:.01em;
    text-shadow:0 2px 14px rgba(0,0,0,.75);
    --caption-lines:5;
    max-height:calc(var(--caption-lines) * 1.62em);
    overflow:clip;
    width:100%;
  }
  .reply-fragment{
    display:inline;
  }
  .reply-exit-layer{
    position:absolute; inset:16px 20px;
    pointer-events:none; text-align:center; z-index:1;
  }
  .reply-fragment-exit{
    position:absolute; left:0; right:0;
    opacity:1; transition:opacity .22s ease;
  }
  .reply-fragment-exit.is-exiting{
    opacity:0;
  }

  /* ── 模式徽章 ─────────────────────────────── */
  .mode{
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    z-index:3;
    font-size:11.5px; letter-spacing:.1em;
    padding:6px 14px; border-radius:999px;
    background:rgba(8,10,14,.66);
    border:1px solid rgba(255,255,255,.12);
    color:rgba(255,255,255,.7);
    display:flex; align-items:center; gap:7px;
    white-space:nowrap;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ring,var(--idle));
       box-shadow:0 0 10px var(--ring,var(--idle))}

  /* ── 覆蓋層（開場 / 錯誤）────────────────── */
  .veil{
    position:absolute; inset:0; z-index:5;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    padding:32px; text-align:center;
    background:rgba(6,7,10,.9);
    backdrop-filter:blur(8px);
  }
  .veil[hidden]{display:none}
  .veil h1{font-size:20px; font-weight:600; letter-spacing:.02em}
  .veil p{font-size:13.5px; line-height:1.7; color:var(--ink-dim); max-width:30ch}
  .veil .err{color:var(--bad)}
  .btn{
    appearance:none; border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.07); color:var(--ink);
    padding:11px 26px; border-radius:999px;
    font-size:14px; font-family:inherit; cursor:pointer;
    transition:background .2s, transform .15s;
  }
  .btn:hover{background:rgba(255,255,255,.14)}
  .btn:active{transform:scale(.97)}
  .btn.ghost{border-color:rgba(255,255,255,.12); background:transparent; color:var(--ink-dim); font-size:12.5px; padding:8px 18px}

  .spinner{
    width:26px;height:26px;border-radius:50%;
    border:2px solid rgba(255,255,255,.16);
    border-top-color:rgba(255,255,255,.75);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── 浮動看板（控制台套用後疊在影像上） ── */
  .float-board{
    position:absolute; z-index:4;
    display:flex; flex-direction:column; min-width:0; min-height:0;
    color:var(--ink);
    background:rgb(10 14 24 / var(--board-alpha,.72));
    backdrop-filter:blur(var(--board-blur,7px)) saturate(160%);
    -webkit-backdrop-filter:blur(var(--board-blur,7px)) saturate(160%);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 18px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
    border-radius:18px;
    overflow:hidden;
    pointer-events:auto;
  }
  .board-close{
    border:0; background:transparent; color:rgba(255,255,255,.75);
    width:28px; height:28px; border-radius:8px; cursor:pointer;
  }
  .board-reopen{
    position:absolute; z-index:4;
    display:inline-flex; align-items:center; flex:0 0 auto; white-space:nowrap;
    transform:translate(-50%,-50%);
    border:1px solid rgba(255,255,255,.18); background:rgba(12,16,26,.78);
    color:var(--ink); padding:6px 12px; border-radius:999px; font-size:12px; cursor:pointer;
  }
  .board-reopen-icon{display:inline-grid;min-width:1em;place-items:center;font-size:18px;line-height:.7}
  .board-reopen[hidden]{display:none!important}
  .float-board[hidden]{display:none!important}
  .float-board .board-head{
    display:flex; align-items:center; justify-content:space-between;
    min-height:40px; padding:8px 12px;
    border-bottom:1px solid rgba(255,255,255,.08);
    font-size:13px; font-weight:650; letter-spacing:.04em;
  }
  .float-board .count-pill{
    font-size:11px; padding:2px 8px; border-radius:999px;
    background:rgba(61,220,151,.16); color:var(--hear);
    border:1px solid rgba(61,220,151,.28);
  }
  .float-board .board-heading{padding:10px 14px 6px}
  .float-board .board-kicker{font-size:10px; letter-spacing:1.4px; color:var(--hear); margin-bottom:4px}
  .float-board .board-heading h3{font-size:16px; line-height:1.4; text-shadow:0 1px 4px #000b}
  .float-board .board-source{font-size:11px; color:var(--ink-dim); margin-top:4px}
  .float-board .board-scroll{min-height:0; flex:1; overflow:auto; padding:4px 14px 10px; scrollbar-color:#4a6277 transparent}
  .float-board .board-list{list-style:none}
  .float-board .board-item{display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,.08)}
  .float-board .board-item:last-child{border:0}
  .float-board .item-number{
    font:11px/24px ui-monospace,monospace; width:24px; height:24px; flex-shrink:0;
    text-align:center; border-radius:7px;
    background:rgba(61,220,151,.12); border:1px solid rgba(61,220,151,.28); color:var(--hear);
  }
  .float-board .item-title{font-size:13.5px; font-weight:650; margin-bottom:3px; text-shadow:0 1px 3px #000c}
  .float-board .item-body{font-size:12px; line-height:1.7; color:#e4ecf6; text-shadow:0 1px 3px #000c}
  .stage[data-board-style="slate"] .float-board{
    border-radius:4px; border:1px solid rgba(242,181,68,.38);
    background:rgb(8 9 12 / var(--board-alpha,.72));
    box-shadow:4px 0 0 var(--think) inset, 0 16px 40px rgba(0,0,0,.5);
  }
  .stage[data-board-style="slate"] .float-board .board-head{background:rgba(242,181,68,.1); text-transform:uppercase; letter-spacing:.14em}
  .stage[data-board-style="slate"] .float-board .board-kicker{color:var(--think)}
  .stage[data-board-style="slate"] .float-board .item-number{border-radius:0; background:var(--think); color:#1a1408; border:0; font-weight:700}
  .stage[data-board-style="slate"] .float-board .board-item{border-bottom:1px dashed rgba(242,181,68,.22)}
  .stage[data-board-style="cue"] .float-board{
    border:0; box-shadow:none; background:rgb(6 8 14 / var(--board-alpha,.72));
    border-radius:22px;
  }
  .stage[data-board-style="cue"] .float-board .board-head{border:0; background:transparent}
  .stage[data-board-style="cue"] .float-board .board-item{
    border:0; background:rgba(255,255,255,.07); border-radius:14px; padding:12px; margin:0 0 8px;
  }
  .stage[data-board-style="cue"] .float-board .item-number{border-radius:999px}

  @media (max-width:520px){
    .stage{border-radius:0; height:100vh; max-width:100vw}
    .mic{width:88px;height:88px}
  }
  @media (prefers-reduced-motion:reduce){
    .ring{animation:none; opacity:.4}
    .spinner{animation-duration:2s}
  }
</style>
</head>
<body>
<div class="room">
  <main class="stage" id="stage" data-voice="idle">
    <video id="video" autoplay playsinline></video>

    <div class="mode" id="mode"><span class="dot"></span><span id="modeText">連線中</span></div>

    <div class="mic-wrap" id="micWrap">
      <button class="mic" id="mic" disabled aria-label="收音">
        <span class="ring"></span><span class="ring b"></span>
        <svg id="micIcon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Z"/>
          <path d="M18.5 11.5a.9.9 0 0 0-1.8 0 4.7 4.7 0 0 1-9.4 0 .9.9 0 0 0-1.8 0 6.5 6.5 0 0 0 5.6 6.43V21h-2.2a.9.9 0 0 0 0 1.8h6.2a.9.9 0 0 0 0-1.8h-2.2v-3.07a6.5 6.5 0 0 0 5.6-6.43Z"/>
        </svg>
      </button>
      <div class="mic-hint" id="hint">準備中</div>
    </div>

    <div class="captions" id="captions">
      <div class="said" id="said"></div>
      <div class="reply-wrap" id="replyWrap">
        <div class="reply-exit-layer" id="replyExitLayer" aria-hidden="true"></div>
        <div class="reply" id="reply"></div>
      </div>
    </div>

    <section class="float-board" id="board" hidden aria-label="回答看板">
      <div class="board-head">
        <span id="boardLabel">回答看板</span>
        <span style="display:flex;align-items:center;gap:6px">
          <span class="count-pill" id="boardBadge">0 項</span>
          <button class="board-close" id="hideBoard" type="button" aria-label="關閉看板">✕</button>
        </span>
      </div>
      <div class="board-heading">
        <div class="board-kicker" id="boardKicker">DETAILS TO KEEP</div>
        <h3 id="boardTitle"></h3>
        <p class="board-source" id="boardSource"></p>
      </div>
      <div class="board-scroll">
        <ol class="board-list" id="boardList"></ol>
      </div>
    </section>
    <button class="board-reopen" id="boardReopen" type="button" hidden aria-pressed="false"><span class="board-reopen-icon" id="boardReopenIcon" aria-hidden="true">▣</span> <span id="boardReopenLabel">展開看板</span></button>

    <button class="btn" id="roleReturn" type="button" hidden
      style="position:absolute;top:16px;left:16px;z-index:10;min-height:44px;max-width:calc(100% - 32px)">返回主數位人</button>

    <div id="conversationComposer"></div>
    <div class="stage-language"><select id="stageLocale" aria-label="舞台語系"><option value="zh-TW">繁體中文</option><option value="en-US">English</option></select><span id="languageStatus" class="stage-language-status" role="status" aria-live="polite"></span></div>
    <div class="veil" id="veil">
      <h1 id="veilTitle">數字人舞台</h1>
      <p id="veilText">點擊進入，瀏覽器會詢問麥克風權限。</p>
      <div id="entryLanguages" class="entry-languages"><button class="btn" type="button" data-locale="zh-TW">繁體中文</button><button class="btn" type="button" data-locale="en-US">English</button></div>
      <button class="btn" id="veilBtn" hidden>進入</button>
      <button class="btn ghost" id="veilAlt" hidden>開啟控制台</button>
    </div>
  </main>
</div>

<script type="module">
import { createApp, h, reactive } from 'vue';
import ConversationComposer from '/src/components/ConversationComposer.vue';
import { composerSettings } from '/src/conversationAttachments.js';
import { stageText, stageItemCount } from '/src/stageLocale.js';
import { canRoleInput, canRoleReturn } from '/src/roleState.js';
import {
  DEFAULT_STAGE_CAPTION_MAX_CHARS,
  StageCaptionWindow
} from '/src/stageCaptionWindow.js';
import { StageCaptionView } from '/src/stageCaptionView.js';
import { shouldFadeStageReply } from '/src/stageReplyLifecycle.js';
import { stageErrorMessage } from '/src/stageErrorMessage.js';
import {
  isKioskMode, kioskReconnectDelayMs, KIOSK_UNAVAILABLE_TITLE, KIOSK_UNAVAILABLE_TEXT
} from '/src/stageKiosk.js';
import {
  fetchJsonWithTimeout, STAGE_CONNECT_TIMEOUT_MS, STAGE_OFFER_TIMEOUT_MS, STAGE_POLL_TIMEOUT_MS
} from '/src/stageConnection.js';
import {
  boardReopenPresentation,
  captionStyle,
  previewScale,
  STAGE_CAPTION_RATIO,
  STAGE_BOARD_PREVIEW_ITEMS,
  STAGE_BOARD_PREVIEW_TITLE,
  placeStageBoard
} from '/src/stageBoardLayout.js';

(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const stage=$('stage'), video=$('video'), mic=$('mic'), hint=$('hint');
  const said=$('said'), replyWrap=$('replyWrap'), reply=$('reply'), replyExitLayer=$('replyExitLayer'), modeText=$('modeText');
  const veil=$('veil'), veilTitle=$('veilTitle'), veilText=$('veilText'),
        veilBtn=$('veilBtn'), veilAlt=$('veilAlt');
  const board=$('board'), boardList=$('boardList'), boardKicker=$('boardKicker'),
        boardBadge=$('boardBadge'), captions=$('captions'), micWrap=$('micWrap'),
        hideBoardBtn=$('hideBoard'), boardReopen=$('boardReopen'), boardReopenIcon=$('boardReopenIcon'), boardReopenLabel=$('boardReopenLabel'),
        boardTitle=$('boardTitle'), boardSource=$('boardSource');

  // ── 連線狀態 ────────────────────────────────
  let pc=null, chan=null, micStream=null;
  let sessionId=0, lastSeq=0;
  let stageLocale='zh-TW', languageSwitching=false, hasConnected=false;
  let stageComposer=null, microphoneRequest=null, enablingMicrophonePress=false, composerCaptureBefore=null, composerBox=null;
  const composerState=reactive({stage:true, sessionId:0, connected:false, enabled:false,
    locale:'zh-TW', settings:composerSettings()});
  createApp({render:()=>h(ConversationComposer, {...composerState,
    ref: instance=>{stageComposer=instance;}, onLayout:box=>{composerBox=box;queueMicrotask(applyBoardLayout);}, onAccepted:({text})=>showSaid(text),
    onEditing: editing=>{
      if(editing){ if(composerCaptureBefore === null) composerCaptureBefore=Boolean(micStream?.getAudioTracks()[0]?.enabled); setCapture(false); }
      else if(composerCaptureBefore !== null){setCapture(composerCaptureBefore);composerCaptureBefore=null;}
    }})}).mount('#conversationComposer');
  const languageSelect=$('stageLocale'), languageStatus=$('languageStatus'), entryLanguages=$('entryLanguages');
  const t = text => stageText(text, stageLocale);
  function applyLocale(locale){
    stageLocale = locale === 'en-US' ? 'en-US' : 'zh-TW';
    composerState.locale=stageLocale;
    languageSelect.value = stageLocale;
    document.documentElement?.setAttribute('lang', stageLocale);
    document.title = `${t('數字人舞台')} · Nova Avatar`;
    languageSelect.setAttribute('aria-label', stageLocale === 'en-US' ? 'Stage language' : '舞台語系');
    mic.setAttribute('aria-label', t('收音'));
    board.setAttribute('aria-label', t('回答看板'));
    hideBoardBtn.setAttribute('aria-label', t('關閉看板'));
    if($('boardLabel')) $('boardLabel').textContent=t('回答看板');
    veilAlt.textContent=t('開啟控制台');
    roleReturn.textContent=t('返回主數位人');
    setMode(); refreshAffordance(); renderBoardItems(); applyBoardLayout();
  }
  function finishLanguageSwitch(locale, failed=false){
    languageSwitching=false;
    languageSelect.disabled=false;
    applyLocale(locale);
    languageStatus.textContent=failed ? t('語系切換失敗，已保留原設定') : '';
    micStream?.getAudioTracks().forEach(track => { track.enabled=autoMode && !autoPaused && canRoleInput(roleState, 'stage'); });
    refreshAffordance();
  }
  let autoMode=false;        // 後台 VAD 開啟 → 自動收音
  let autoPaused=false;      // 自動模式下使用者主動暫停收音
  let holding=false;         // 按鍵收音進行中
  let interruptedPress=false;// 插話按下後，鬆開仍屬於同一次操作
  let speaking=false;        // 數字人正在說話
  let roleState={enabled:false};
  let captureWanted=false;
  const roleReturn=$('roleReturn');
  roleReturn.addEventListener('click',()=>send({type:'role_return'}));
  const kiosk = isKioskMode(window.location.search);
  let reconnectTimer=null, reconnectAttempt=0;
  // 每次 connect/teardown 都換新編號：逾時後仍在等待的舊嘗試回來時直接丟棄。
  let connectAttempt=0, connectWatchdog=null, lostAttempt=-1;
  let live=false;
  let replyTimer=null, saidTimer=null;
  let replyTurnId=null, replyRevision=0;
  let configuredCaptionMaxChars=DEFAULT_STAGE_CAPTION_MAX_CHARS;
  let captionWindow=null;
  let captionView=null;
  const BOARD_KICKERS={glass:'DETAILS TO KEEP',slate:'CALL SHEET',cue:'ON SCREEN'};
  const boardLayout={
    style:'glass', width:252, height:300, transparency:28,
    x:100, y:0, preset:'tr', preview:false
  };
  const micLayout={x:50, y:62, preset:'custom'};
  const boardOpenLayout={x:50, y:8};
  const captionLayout={x:50, y:90, width:100};
  const liveBoard={title:'', items:[], hidden:false, turnId:null};
  const displayedBoardReceipts=new Set();

  function acknowledgeBoardDisplay(ev, itemIndex){
    const turnId=String(ev.turn_id||'');
    const boardId=String(ev.board_id||turnId);
    if(!turnId || boardId!==turnId || !Number.isInteger(itemIndex) || itemIndex<0) return;
    const receiptKey=`${turnId}:${boardId}:${itemIndex}`;
    if(displayedBoardReceipts.has(receiptKey)) return;
    requestAnimationFrame(()=>{
      if(displayedBoardReceipts.has(receiptKey)) return;
      if(send({type:'board_displayed', turn_id:turnId, board_id:boardId, item_index:itemIndex, presenter:'stage'})){
        displayedBoardReceipts.add(receiptKey);
      }
    });
  }

  function displayBoard(){
    if(liveBoard.items.length){
      return {title:liveBoard.title, items:liveBoard.items, preview:false};
    }
    if(boardLayout.preview){
      return {title:STAGE_BOARD_PREVIEW_TITLE, items:STAGE_BOARD_PREVIEW_ITEMS, preview:true};
    }
    return {title:'', items:[], preview:false};
  }
  const escapeText=value=>String(value || '').replace(/[&<>"']/g, char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  function renderBoardItems(){
    if(!boardList) return;
    const shown=displayBoard();
    boardList.innerHTML=shown.items.map((item,n)=>
      `<li class="board-item"><span class="item-number">${String(n+1).padStart(2,'0')}</span><div><div class="item-title">${escapeText(item.title)}</div><p class="item-body">${escapeText(item.body)}</p></div></li>`
    ).join('');
    if(boardBadge) boardBadge.textContent=shown.preview ? t('預覽') : stageItemCount(shown.items.length,stageLocale);
    if(boardTitle) boardTitle.textContent=shown.title;
    if(boardSource) boardSource.textContent=shown.preview ? t('控制台預覽 · 對位置與大小，非本輪回答') : (shown.items.length ? t('本輪條列 · 可關閉後再展開') : '');
  }
  function clearLiveBoard(){
    liveBoard.title='';
    liveBoard.items=[];
    liveBoard.hidden=false;
    liveBoard.turnId=null;
    renderBoardItems();
    applyBoardLayout();
  }
  function applyBoardLayout(){
    if(micWrap){
      micWrap.style.left=`${micLayout.x}%`;
      micWrap.style.top=`${micLayout.y}%`;
      micWrap.style.transform='translate(-50%,-50%)';
    }
    if(boardReopen){
      const boardOpenPresentation=boardReopenPresentation(boardOpenLayout.x, boardOpenLayout.y);
      Object.assign(boardReopen.style, boardOpenPresentation.style);
      boardReopen.dataset.edge=boardOpenPresentation.edge;
      if(boardReopenIcon) boardReopenIcon.textContent=boardOpenPresentation.icon;
    }
    if(captions) Object.assign(captions.style, captionStyle(captionLayout.x, captionLayout.y, captionLayout.width));
    if(!board || !captions) return;
    stage.dataset.boardStyle=boardLayout.style || 'glass';
    boardKicker.textContent=BOARD_KICKERS[boardLayout.style] || BOARD_KICKERS.glass;
    renderBoardItems();
    const shown=displayBoard();
    const hasItems=shown.items.length>0;
    const show=hasItems && !liveBoard.hidden;
    board.hidden=!show;
    if(boardReopen){
      boardReopen.hidden=!hasItems;
      boardReopen.setAttribute('aria-pressed', String(!liveBoard.hidden));
      if(boardReopenLabel) boardReopenLabel.textContent=t(liveBoard.hidden ? '展開看板' : '收合看板');
    }
    if(!hasItems) return;
    const scale=previewScale(stage.clientWidth, stage.clientHeight);
    const box=placeStageBoard({
      stageW:stage.clientWidth,
      stageH:stage.clientHeight,
      targetW:boardLayout.width,
      targetH:boardLayout.height,
      x:boardLayout.x,
      y:boardLayout.y,
      scale,
      captionRatio: STAGE_CAPTION_RATIO
    });
    Object.assign(board.style,{
      width:`${box.width}px`, height:`${box.height}px`,
      left:`${box.left}px`, top:`${box.top}px`
    });
    board.style.setProperty('--board-alpha', 1-boardLayout.transparency/100);
    board.style.setProperty('--board-blur', `${(1-boardLayout.transparency/100)*12}px`);
  }

  // ── 舞台狀態 ────────────────────────────────
  // 後端 12 種 state 壓成 4 種視覺語言，異常態走覆蓋層
  const VISUAL = {
    listening:'idle', preparing:'idle',
    speech_detected:'hearing',
    stt:'thinking', llm:'thinking', tts_ready:'thinking',
    avatar_speaking:'speaking', tail_guard:'speaking',
    paused:'paused'
  };

  function setVisual(v){ stage.dataset.voice = v; }

  function refreshAffordance(){
    composerState.connected=live && !languageSwitching && canRoleInput(roleState,'stage');
    if(!live || languageSwitching){ mic.disabled=true; hint.textContent=t('準備中'); return; }
    if(!canRoleInput(roleState,'stage')){
      mic.disabled=true;
      hint.textContent=t('角色轉場中，請稍候');
      return;
    }
    mic.disabled=false;
    if(!micStream){hint.textContent=t('啟用麥克風');return;}
    if(speaking){ hint.textContent = t('點一下插話'); return; }
    if(autoMode){ hint.textContent = t(autoPaused ? '已暫停收音，點一下恢復' : '直接說話'); return; }
    hint.textContent = t(holding ? '放開送出' : '按住說話');
  }

  function setMode(){
    modeText.textContent = t(!live ? '連線中'
      : autoMode ? (autoPaused ? '自動收音・已暫停' : '自動收音')
      : '按鍵收音');
  }

  function showReply(text, turnId){
    clearTimeout(replyTimer);
    const normalizedTurnId = turnId || null;
    const newTurn = normalizedTurnId !== replyTurnId;
    if(newTurn){
      clearReply();
      replyTurnId = normalizedTurnId;
      captionWindow = new StageCaptionWindow(configuredCaptionMaxChars);
      captionView = new StageCaptionView({
        container:reply,
        exitLayer:replyExitLayer,
        captionWindow
      });
    }
    if(!captionWindow || !captionView){
      captionWindow = new StageCaptionWindow(configuredCaptionMaxChars);
      captionView = new StageCaptionView({
        container:reply,
        exitLayer:replyExitLayer,
        captionWindow
      });
      replyTurnId = normalizedTurnId;
    }
    captionView.append(text, normalizedTurnId);
    replyRevision++;
    reply.classList.add('on');
    replyWrap?.classList.add('on');
  }
  function fadeReply(turnId=replyTurnId){
    clearTimeout(replyTimer);
    const revision = replyRevision;
    replyTimer = setTimeout(() => {
      if(revision === replyRevision && turnId === replyTurnId){
        reply.classList.remove('on');
        replyWrap?.classList.remove('on');
      }
    }, 3000);
  }
  function clearReply(){
    clearTimeout(replyTimer);
    replyRevision++;
    replyTurnId = null;
    captionWindow = null;
    captionView?.clear();
    captionView?.destroy();
    captionView = null;
    reply.textContent = '';
    replyExitLayer.textContent = '';
    reply.classList.remove('on');
    replyWrap?.classList.remove('on');
  }
  function showSaid(text){
    clearTimeout(saidTimer);
    said.textContent = text;
    said.classList.add('on');
    saidTimer = setTimeout(() => said.classList.remove('on'), 4500);
  }

  function showVeil(title, text, {isError=false, btn='重試', onBtn=null, alt=false}={}){
    veilTitle.textContent = t(title);
    veilText.textContent = t(text);
    veilText.classList.toggle('err', isError);
    veilBtn.textContent = t(btn);
    veilBtn.hidden = !onBtn;
    veilBtn.onclick = onBtn;
    veilAlt.hidden = !alt;
    veil.hidden = false;
  }
  const hideVeil = () => { veil.hidden = true; };

  veilAlt.onclick = () => { window.location.href = '/'; };

  // ── 控制訊息 ────────────────────────────────
  function send(msg){
    if(!chan || chan.readyState !== 'open') return false;
    chan.send(JSON.stringify(msg));
    return true;
  }
  function reportStageReady(){
    send({type:'stage_ready', audible:live && !video.paused && !video.muted && video.volume > 0,
      microphone:Boolean(micStream?.getAudioTracks().some(t => t.readyState === 'live' && !t.muted)),
      interaction:!autoPaused});
  }
  for(const event of ['playing','pause','volumechange','emptied']) video.addEventListener(event, reportStageReady);
  function setCapture(enabled, finalize=false){
    captureWanted=Boolean(enabled);
    micStream?.getAudioTracks().forEach(t => { t.enabled = captureWanted && canRoleInput(roleState,'stage'); });
    reportStageReady();
    return send({type:'capture', enabled:Boolean(enabled), finalize, manual_pause:autoPaused});
  }
  function interrupt(){
    autoPaused = false;
    setCapture(true);
    setMode();
    return send({type:'interrupt'});
  }

  // ── 收音模式：跟著後台 VAD 開關走 ────────────
  async function syncVadMode(){
    try{
      const {ok, data:payload} = await fetchJsonWithTimeout('/api/vad', {cache:'no-store'}, STAGE_POLL_TIMEOUT_MS);
      if(!ok) return;
      const next = Boolean(payload?.data?.enabled);
      if(next === autoMode) return;
      autoMode = next;
      autoPaused = false;
      holding = false;
      if(live) setCapture(autoMode && !speaking);
      setMode(); refreshAffordance();
    }catch(_){ /* 後台不可達時維持現有模式 */ }
  }

  async function syncStageSettings(){
    try{
      const {ok, data:payload} = await fetchJsonWithTimeout('/api/stage', {cache:'no-store'}, STAGE_POLL_TIMEOUT_MS);
      if(!ok) return;
      const data = payload?.data || {};
      composerState.settings={...composerSettings(data), idle_reset_seconds:Number(data.idle_reset_seconds || 60)}; composerState.enabled=Boolean(data.composer_enabled);
      const next = Number(data.caption_max_chars);
      if(Number.isInteger(next) && next >= 20 && next <= 2000){
        configuredCaptionMaxChars = next;
      }
      const captionX=Number(data.caption_x), captionY=Number(data.caption_y), captionWidth=Number(data.caption_width);
      if(Number.isInteger(captionX) && captionX>=0 && captionX<=100) captionLayout.x=captionX;
      if(Number.isInteger(captionY) && captionY>=0 && captionY<=100) captionLayout.y=captionY;
      if(Number.isInteger(captionWidth) && captionWidth>=40 && captionWidth<=100) captionLayout.width=captionWidth;
      const style = String(data.board_style || 'glass');
      if(['glass','slate','cue'].includes(style)) boardLayout.style = style;
      const width = Number(data.board_width);
      const height = Number(data.board_height);
      const transparency = Number(data.board_transparency);
      const x = Number(data.board_x);
      const y = Number(data.board_y);
      if(Number.isInteger(width) && width >= 200 && width <= 720) boardLayout.width = width;
      if(Number.isInteger(height) && height >= 180 && height <= 720) boardLayout.height = height;
      if(Number.isInteger(transparency) && transparency >= 0 && transparency <= 100) boardLayout.transparency = transparency;
      if(Number.isInteger(x) && x >= 0 && x <= 100) boardLayout.x = x;
      if(Number.isInteger(y) && y >= 0 && y <= 100) boardLayout.y = y;
      if(typeof data.board_preset === 'string') boardLayout.preset = data.board_preset;
      boardLayout.preview = Boolean(data.board_preview);
      const boardOpenX=Number(data.board_open_x), boardOpenY=Number(data.board_open_y);
      if(Number.isInteger(boardOpenX) && boardOpenX>=0 && boardOpenX<=100) boardOpenLayout.x=boardOpenX;
      if(Number.isInteger(boardOpenY) && boardOpenY>=0 && boardOpenY<=100) boardOpenLayout.y=boardOpenY;
      const micX=Number(data.mic_x), micY=Number(data.mic_y);
      if(Number.isInteger(micX) && micX>=0 && micX<=100) micLayout.x=micX;
      if(Number.isInteger(micY) && micY>=0 && micY<=100) micLayout.y=micY;
      if(typeof data.mic_preset === 'string') micLayout.preset=data.mic_preset;
      applyBoardLayout();
    }catch(_){ /* 後台不可達時維持現有舞台設定 */ }
  }

  // ── 會話事件 ────────────────────────────────
  function onVoiceEvent(ev){
    if(ev.mirrored) return;
    stageComposer?.receive(ev);
    if(ev.type === 'conversation_settings_pending'){
      languageSwitching=true; languageSelect.disabled=true;
      languageStatus.textContent=t('正在切換語系…'); holding=false;
      micStream?.getAudioTracks().forEach(track=>{track.enabled=false;});
      refreshAffordance(); return;
    }
    if(ev.type === 'conversation_settings'){ finishLanguageSwitch(ev.locale); return; }
    if(ev.type === 'conversation_settings_error'){ finishLanguageSwitch(ev.locale || stageLocale,true); return; }
    if(ev.type === 'answer_clear'){ clearReply(); said.textContent=''; said.classList.remove('on'); return; }
    if(ev.type==='role_state'){
      roleState=ev;
      if(ev.error) showSaid('角色暫時無法切換，請再試一次。');
      roleReturn.hidden=!(ev.enabled && ev.can_return);
      roleReturn.disabled=!canRoleReturn(ev);
      micStream?.getAudioTracks().forEach(t=>{t.enabled=captureWanted && canRoleInput(ev,'stage');});
      refreshAffordance();
      return;
    }
    if(ev.type==='role_error'){showSaid('目前無法切換角色，請稍後再試。');return;}
    if(ev.type==='role_clear'){
      speaking=false;holding=false;interruptedPress=false;
      clearTimeout(saidTimer);said.classList.remove('on');said.textContent='';
      clearReply();clearLiveBoard();refreshAffordance();return;
    }
    if(ev.type === 'state'){
      if(ev.state === 'error' || ev.state === 'degraded'){
        const friendly = stageErrorMessage(ev);
        if(friendly){
          console.warn('[stage] voice session', ev.state, ev.error);
          showReply(friendly, null);
        }
        fadeReply();
      }
      const v = VISUAL[ev.state];
      if(v) setVisual(v);
      if(ev.state === 'listening'){ speaking = false; }
      refreshAffordance();
      return;
    }
    if(ev.type === 'user_transcript' && ev.text){ showSaid(ev.text); return; }
    if(ev.type === 'board_clear'){ clearLiveBoard(); return; }
    if(ev.type === 'conversation_reset' || ev.type === 'presentation_reset'){
      clearTimeout(saidTimer);
      said.classList.remove('on');
      said.textContent = '';
      clearReply();
      clearLiveBoard();
      return;
    }
    if(ev.type === 'assistant_board' && ev.board){
      liveBoard.turnId=ev.turn_id||null;
      liveBoard.title=ev.board.title||'';
      liveBoard.items=Array.isArray(ev.board.items)?ev.board.items:[];
      liveBoard.hidden=false;
      renderBoardItems(); applyBoardLayout();
      liveBoard.items.forEach((_item,index)=>acknowledgeBoardDisplay(ev,index));
      return;
    }
    if(ev.type === 'board_begin'){
      liveBoard.turnId=ev.turn_id||null;
      liveBoard.title=ev.title||'';
      liveBoard.items=[];
      liveBoard.hidden=false;
      renderBoardItems(); applyBoardLayout(); return;
    }
    if(ev.type === 'board_item'){
      liveBoard.items.push({title:ev.title||'', body:ev.body||''});
      renderBoardItems(); applyBoardLayout(); acknowledgeBoardDisplay(ev, Number(ev.index)); return;
    }
    if(ev.type === 'board_end'){ applyBoardLayout(); return; }
    if(ev.type === 'assistant_fragment' && ev.text){
      showReply(ev.text, ev.turn_id); return;
    }
    if(ev.type === 'assistant_fragment_end'){
      return;
    }
    if(ev.type === 'speaking_start'){
      clearTimeout(replyTimer);
      if(reply.textContent){
        reply.classList.add('on');
        replyWrap?.classList.add('on');
      }
      speaking = true; setVisual('speaking'); refreshAffordance(); return;
    }
    if(ev.type === 'speaking_end'){
      speaking = false;
      if(shouldFadeStageReply(ev.type)) fadeReply(ev.turn_id);
      setVisual(autoMode && !autoPaused ? 'idle' : 'paused');
      refreshAffordance(); return;
    }
    if(ev.type === 'turn_committed'){
      if(shouldFadeStageReply(ev.type)) fadeReply(ev.turn_id);
      return;
    }
    if(ev.type === 'turn_cancelled'){
      speaking = false; clearReply(); refreshAffordance();
    }
  }

  // 連不上時依退避時間自動重連。kiosk 一律如此；一般舞台只在逾時或
  // 事件通道失效（影像還在、畫面看不出問題）時自動重連。
  function scheduleReconnect(){
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, kioskReconnectDelayMs(reconnectAttempt++));
  }
  function showKioskProblem(){
    showVeil(KIOSK_UNAVAILABLE_TITLE, KIOSK_UNAVAILABLE_TEXT, {isError:true, btn:'重新連線', onBtn:connect});
    scheduleReconnect();
  }
  // 卡在「連線中」超過上限：拆掉這次嘗試，露出重試並自動重連。
  function connectTimedOut(attempt){
    if(attempt !== connectAttempt || live) return;
    teardown();
    if(kiosk){ showKioskProblem(); return; }
    showVeil('連線逾時', '連線時間過長，正在自動重新連線。', {isError:true, btn:'重試', onBtn:connect, alt:true});
    scheduleReconnect();
  }
  // 同一次連線的 peer 失敗與通道關閉只處理一次，避免重複排程拉長退避。
  function connectionLost(attempt, {auto=false}={}){
    if(attempt !== connectAttempt || lostAttempt === attempt) return;
    lostAttempt = attempt;
    live = false; reportStageReady(); setMode(); refreshAffordance();
    if(kiosk){ showKioskProblem(); return; }
    showVeil('連線中斷', '與數字人的通道已斷開。', {isError:true, btn:'重新連線', onBtn:connect});
    if(auto) scheduleReconnect();
  }

  // ── 建立 WebRTC 連線 ────────────────────────
  async function connect(){
    clearTimeout(reconnectTimer);
    teardown();
    const attempt = connectAttempt;
    const stale = () => attempt !== connectAttempt;
    connectWatchdog = setTimeout(() => connectTimedOut(attempt), STAGE_CONNECT_TIMEOUT_MS);
    autoPaused = false;
    entryLanguages.hidden=true;
    await syncStageSettings();
    if(stale()) return;
    showVeil('連線中', '正在建立與數字人的即時通道。', {btn:'', onBtn:null});
    veilBtn.hidden = true;

    const peer = pc = new RTCPeerConnection({iceServers:[]});

    const remote = new MediaStream();
    // 只綁一次 srcObject。音軌與視訊軌是分開抵達的，每次 ontrack 都重綁會讓
    // 元素重新接管已在播放的音訊管線，兩軌可能因此跑在各自的時鐘上。
    video.srcObject = remote;
    peer.ontrack = (e) => {
      if(!remote.getTracks().some(t => t.id === e.track.id)) remote.addTrack(e.track);
    };
    peer.onconnectionstatechange = () => {
      if(stale()) return;
      const s = peer.connectionState;
      if(s === 'connected'){
        live = true; lostAttempt = -1; reconnectAttempt = 0;
        clearTimeout(reconnectTimer); clearTimeout(connectWatchdog);
        hideVeil(); setMode(); refreshAffordance(); reportStageReady();
      }
      if(s === 'failed' || s === 'disconnected') connectionLost(attempt);
    };

    const channel = chan = peer.createDataChannel('voice-events', {ordered:true});
    channel.onopen = () => setCapture(autoMode && Boolean(micStream));
    channel.onmessage = (e) => {
      try{
        const msg = JSON.parse(e.data);
        if(!Number.isFinite(msg.seq) || msg.seq <= lastSeq) return;
        lastSeq = msg.seq;
        onVoiceEvent(msg);
      }catch(_){ /* 壞掉的事件直接丟掉 */ }
    };
    // 通道關閉而影像仍在時，字幕與看板會無聲停擺：比照控制台直接重連。
    channel.onclose = () => connectionLost(attempt, {auto:true});
    channel.onerror = () => connectionLost(attempt, {auto:true});

    // 麥克風拿不到也要能看數字人，退成純觀看
    try{
      const stream = await navigator.mediaDevices.getUserMedia({
        audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true, channelCount:1}
      });
      if(stale()){ stream.getTracks().forEach(t => t.stop()); return; }
      micStream = stream;
      for(const track of micStream.getAudioTracks()) for(const event of ['ended','mute','unmute']) track.addEventListener?.(event, reportStageReady);
      peer.addTrack(micStream.getAudioTracks()[0], micStream);
      micStream.getAudioTracks()[0].enabled = false;
    }catch(err){
      if(stale()) return;
      micStream = null;
      peer.addTransceiver('audio', {direction:composerState.enabled ? 'sendrecv' : 'recvonly'});
      if(!composerState.enabled) showSaid(t('麥克風無法使用，目前為純觀看'));
    }
    peer.addTransceiver('video', {direction:'recvonly'});

    try{
      const offer = await peer.createOffer();
      if(stale()) return;
      await peer.setLocalDescription(offer);
      if(stale()) return;
      const res = await fetchJsonWithTimeout('/offer', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          client_role:'stage', locale:stageLocale, has_microphone:Boolean(micStream),
          sdp:peer.localDescription.sdp,
          type:peer.localDescription.type
        })
      }, STAGE_OFFER_TIMEOUT_MS);
      if(stale()) return;
      if(!res.ok){
        const m = res.data?.msg || `HTTP ${res.status}`;
        if(res.status === 409){
          teardown();
          if(kiosk) showKioskProblem();
          else showVeil('數字人尚未就緒', m, {btn:'重試', onBtn:connect, alt:true});
          return;
        }
        throw new Error(m);
      }
      const data = res.data || {};
      sessionId = data.sessionid; composerState.sessionId=sessionId;
      if(data.conversation) finishLanguageSwitch(data.conversation.locale);
      await peer.setRemoteDescription(new RTCSessionDescription({sdp:data.sdp, type:data.type}));
    }catch(err){
      if(stale()) return;
      if(err?.name === 'TimeoutError'){ connectTimedOut(attempt); return; }
      teardown();
      if(kiosk) showKioskProblem();
      else showVeil('無法連線', String(err.message || err), {isError:true, btn:'重試', onBtn:connect});
    }
  }

  function teardown(){
    connectAttempt++;
    clearTimeout(connectWatchdog);
    send({type:'stage_ready', audible:false, microphone:false, interaction:false});
    roleState={enabled:false};captureWanted=false;roleReturn.hidden=true;
    composerState.connected=false;
    live = false; speaking = false; holding = false; interruptedPress = false; lastSeq = 0;
    clearReply();
    if(chan){ chan.onclose=null; chan.onerror=null; try{chan.close();}catch(_){ /* 已關閉 */ } }
    chan = null;
    if(pc){ try{pc.close();}catch(_){ /* 已關閉 */ } }
    pc = null;
    micStream?.getTracks().forEach(t => t.stop());
    micStream = null;
    video.srcObject = null;
    setVisual('idle');
    refreshAffordance();
  }

  // ── 中央按鈕：按鍵收音 / 自動模式開關 / 插話 ──
  async function enableMicrophone(){
    if(microphoneRequest || !pc) return;
    const peer=pc;
    microphoneRequest=navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});
    try{
      const stream=await microphoneRequest;
      if(peer !== pc){stream.getTracks().forEach(track=>track.stop());return;}
      const sender=peer.getTransceivers().find(item=>item.receiver.track.kind === 'audio')?.sender;
      if(!sender){stream.getTracks().forEach(track=>track.stop());throw new Error('Audio sender unavailable');}
      await sender.replaceTrack(stream.getAudioTracks()[0]);
      micStream=stream; autoPaused=false;
      setCapture(autoMode); setMode(); refreshAffordance();
    }catch(_){showSaid(stageLocale === 'en-US' ? 'Microphone unavailable. Text and attachments are still available.' : '無法啟用麥克風，仍可使用文字與附件。');}
    finally{microphoneRequest=null;}
  }
  mic.addEventListener('pointerdown', (e) => {
    if(mic.disabled) return;
    e.preventDefault();
    if(!micStream){enablingMicrophonePress=true;enableMicrophone();return;}
    interruptedPress = false;
    if(speaking){ interruptedPress = true; interrupt(); return; }
    if(autoMode) return;                 // 自動模式在 pointerup 才切換
    holding = true;
    setCapture(true);
    setVisual('hearing');
    refreshAffordance();
  });

  const release = () => {
    if(enablingMicrophonePress){enablingMicrophonePress=false;return;}
    if(!holding) return;
    holding = false;
    setCapture(false, true);             // finalize：把這段發話收尾送去 STT
    setVisual('thinking');
    refreshAffordance();
  };
  mic.addEventListener('pointerup', (e) => {
    if(mic.disabled) return;
    e.preventDefault();
    if(enablingMicrophonePress){enablingMicrophonePress=false;return;}
    if(!micStream || microphoneRequest) return;
    if(interruptedPress){ interruptedPress = false; return; }
    if(autoMode && !speaking){
      autoPaused = !autoPaused;
      setCapture(!autoPaused);
      setVisual(autoPaused ? 'paused' : 'idle');
      setMode(); refreshAffordance();
      return;
    }
    release();
  });
  mic.addEventListener('pointercancel', release);
  mic.addEventListener('pointerleave', release);

  // 空白鍵 = 同一顆按鈕
  addEventListener('keydown', (e) => {
    if(e.target?.closest?.('button, input, textarea, select, a') && e.target !== mic) return;
    if(e.code !== 'Space' || e.repeat || mic.disabled) return;
    e.preventDefault();
    mic.dispatchEvent(new PointerEvent('pointerdown', {bubbles:true}));
  });
  addEventListener('keyup', (e) => {
    if(e.target?.closest?.('button, input, textarea, select, a') && e.target !== mic) return;
    if(e.code !== 'Space' || mic.disabled) return;
    e.preventDefault();
    mic.dispatchEvent(new PointerEvent('pointerup', {bubbles:true}));
  });

  // ── 開場：需要一次使用者手勢才能自動播放帶聲音的影片 ──
  async function startSession(locale=stageLocale){
    if(typeof locale !== "string") locale=stageLocale;
    applyLocale(locale); entryLanguages.hidden=true;
    veilBtn.hidden = true;
    await syncVadMode();
    await syncStageSettings();
    await connect();
    try{ await video.play(); reportStageReady(); }catch(_){ reportStageReady(); }
  }
  veilBtn.onclick = () => startSession();
  entryLanguages.querySelectorAll('[data-locale]').forEach(button=>{button.onclick=()=>startSession(button.dataset.locale);});
  languageSelect.onchange=()=>{
    const locale=languageSelect.value;
    if(!live){applyLocale(locale);return;}
    languageSelect.value=stageLocale; languageSwitching=true; languageSelect.disabled=true;
    micStream?.getAudioTracks().forEach(track=>{track.enabled=false;});
    refreshAffordance();
    if(!send({type:'conversation_settings',settings:{locale}})) finishLanguageSwitch(stageLocale,true);
  };

  addEventListener('beforeunload', teardown);

  // 後台改 VAD 開關後，這裡最多 5 秒跟上
  setInterval(() => { syncVadMode(); syncStageSettings(); }, 5000);
  addEventListener('resize', applyBoardLayout);
  if(window.ResizeObserver) new ResizeObserver(applyBoardLayout).observe(stage);
  hideBoardBtn?.addEventListener('click', () => { liveBoard.hidden=true; applyBoardLayout(); });
  boardReopen?.addEventListener('click', () => { liveBoard.hidden=!liveBoard.hidden; applyBoardLayout(); });
  setMode();
  applyBoardLayout();
  if(kiosk) startSession();
})();
</script>
</body>
</html>
