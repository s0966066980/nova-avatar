[project]
name = "nova-avatar-contracts"
version = "0.1.0"
description = "Cross-layer contracts of Nova Avatar: request/response models, stream events and layer protocols"
readme = "README.md"
requires-python = ">=3.10, <3.12"
license = { text = "Apache-2.0" }
maintainers = [{ name = "HongXian0903" }]
# Only Pydantic: a layer must be able to depend on its contract without
# pulling in any other layer (ADR 0028).
dependencies = ["pydantic>=2"]

[build-system]
requires = ["setuptools==69.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nova_contracts*"]
