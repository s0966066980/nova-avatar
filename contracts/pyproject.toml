# Cross-layer contracts (ADR 0028): Pydantic models and Protocols only.
# Keep the dependency list to pydantic; anything heavier belongs in a layer.
[project]
name = "nova-contracts"
version = "0.1.0"
description = "Cross-layer contracts (models and Protocols) for Nova Avatar"
readme = "README.md"
requires-python = ">=3.10, <3.12"
license = { text = "Apache-2.0" }
maintainers = [{ name = "HongXian0903" }]
dependencies = [
    "pydantic>=2.7,<3",
]

[tool.setuptools]
packages = ["nova_contracts"]

[tool.setuptools.package-data]
nova_contracts = ["py.typed"]

[build-system]
requires = ["setuptools==69.5.1", "wheel"]
build-backend = "setuptools.build_meta"
