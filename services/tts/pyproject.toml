# TTS processing layer (ADR 0027): engines, audio library, voice models and
# voice training. The root project installs it as a path dependency and shares
# the root uv.lock (ADR 0028). The layer imports nova_core.utils (the shared
# leaf) but does not declare nova-core: the core already depends on the layers'
# adapters, so declaring it would be a cycle.
[project]
name = "nova-tts"
version = "0.1.0"
description = "Text-to-speech processing layer of Nova Avatar"
readme = "README.md"
requires-python = ">=3.10, <3.12"
license = { text = "Apache-2.0" }
maintainers = [{ name = "HongXian0903" }]
dependencies = [
    "nova-contracts",
    "aiohttp",
    "av",
    "edge-tts",
    "faster-whisper>=1.1",
    "numpy<2",
    "onnxruntime>=1.16,<1.24",
    "opencc>=1.1.9",
    "requests",
    "resampy",
    # CPU runtime for Matcha voice models (聲線模型); see nova_tts/voice_models.py.
    "sherpa-onnx==2.0.1",
    "soundfile==0.12.1",
]

[tool.setuptools.packages.find]
include = ["nova_tts*"]

[build-system]
requires = ["setuptools==69.5.1", "wheel"]
build-backend = "setuptools.build_meta"
