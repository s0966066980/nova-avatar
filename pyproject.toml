[project]
name = "nova-avatar"
version = "1.0.0"
description = "Real-time full-duplex conversational digital human framework"
readme = "README.md"
requires-python = ">=3.10, <3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "HongXian0903" }
]
maintainers = [
    { name = "HongXian0903" }
]

dependencies = [
    "aiohttp",
    "aiohttp-cors",
    "aiortc",
    "av",
    "edge-tts",
    "faster-whisper>=1.1",
    "ctranslate2==4.8.2; platform_machine == 'aarch64'",
    "onnxruntime>=1.16,<1.24",
    "librosa",
    "omegaconf",
    "opencc>=1.1.9",
    "openai",
    "numpy<2",
    "opencv-python-headless<4.12",
    "Pillow>=10,<13",
    "pydantic",
    "PyYAML",
    "scipy",
    "soundfile==0.12.1",
    "torch==2.5.0; platform_machine != 'aarch64'",
    "torchvision==0.20.0; platform_machine != 'aarch64'",
    "torchaudio==2.5.0; platform_machine != 'aarch64'",
    # JetPack 7 / Orin: ARM64 CUDA wheels; the CUDA 13.2 driver supports cu130.
    "torch==2.11.0; platform_machine == 'aarch64'",
    "torchvision==0.26.0; platform_machine == 'aarch64'",
    "torchaudio==2.11.0; platform_machine == 'aarch64'",
    "optree>=0.13; platform_machine == 'aarch64'",
    "tqdm",
    "typing-extensions",
    "websockets==12.0",
    "resampy",
    "logger",
    # mmengine/mmpose still import pkg_resources; setuptools>=82 removed it.
    "setuptools==69.5.1",
    "transformers==4.46.0",
    "pypdfium2>=5.14,<6",
]

# 服務端 VAD 依賴（按需安裝：uv pip install -e ".[vad]"）
[project.optional-dependencies]
vad = [
    "silero-vad>=5.1",           # Silero VAD，pip 包自帶模型，可離線使用
]
funasr = [
    "funasr>=1.1",
]
musetalk = [
    "nova-avatar-musetalk",
]

[project.urls]
Repository = "https://github.com/s0966066980/nova-avatar"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv.sources]
nova-avatar-musetalk = { path = "src/avatars/musetalk", editable = true }
# Built by setup-jetson.sh before uv sync; pin the source to prevent uv run
# replacing the CUDA build with PyPI's CPU-only ARM64 wheel.
ctranslate2 = [
    { path = ".local/jetson/wheels/ctranslate2-4.8.2-cp311-cp311-linux_aarch64.whl", marker = "platform_machine == 'aarch64' and python_version == '3.11'" },
]
torch = [
    { index = "pytorch-cu124", marker = "platform_machine != 'aarch64'" },
    { index = "pytorch-cu130", marker = "platform_machine == 'aarch64'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "platform_machine != 'aarch64'" },
    { index = "pytorch-cu130", marker = "platform_machine == 'aarch64'" },
]
torchaudio = [
    { index = "pytorch-cu124", marker = "platform_machine != 'aarch64'" },
    { index = "pytorch-cu130", marker = "platform_machine == 'aarch64'" },
]

[tool.pytest.ini_options]
markers = [
    "avatar: MuseTalk transition and rendering behavior",
    "conversation: reply protocol, streaming, media, playback, and voice-session behavior",
    "governance: branding, licensing, packaging, and integration audit contracts",
    "llm: model routing, profiles, normalization, and local model lifecycle",
    "ragflow: optional RAGFlow integration behavior",
    "runtime: server health, runtime settings, and optional dependency contracts",
    "speech: ASR, VAD, TTS, and speech worker behavior",
    "slow: deterministic tests that normally take at least one second",
    "live: opt-in tests that use an explicitly configured external model",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["setuptools==69.5.1", "wheel"]
build-backend = "setuptools.build_meta"
