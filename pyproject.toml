[project]
name = "nova-avatar"
version = "1.0.0"
description = "Real-time full-duplex conversational digital human framework"
readme = "README.md"
requires-python = ">=3.10, <3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "HongXian0903" }
]
maintainers = [
    { name = "HongXian0903" }
]

dependencies = [
    # The core, the processing layers and the contracts (ADR 0027, ADR 0028):
    # path dependencies that share this uv.lock. Each declares its own
    # third-party packages in its pyproject.toml.
    "nova-contracts",
    "nova-core",
    "nova-stt",
    "nova-llm",
    "nova-tts",
    "nova-render",
    # Pinned for the whole environment; uv applies [tool.uv.sources] to
    # requirements declared here only, so torch stays declared in this file.
    "torch==2.5.0",
    "torchvision",
    "torchaudio",
    "transformers==4.46.0",
    "typing-extensions",
    "websockets==12.0",
    # mmengine/mmpose still import pkg_resources; setuptools>=82 removed it.
    "setuptools==69.5.1",
]

# Optional installs live in the layer that owns them; these names forward to
# them so `uv sync --extra musetalk` and `.[vad]` keep working.
[project.optional-dependencies]
# Server-side VAD: uv pip install -e ".[vad]"
vad = [
    "nova-core[vad]",
]
musetalk = [
    "nova-render[musetalk]",
]
tensorrt = [
    "nova-render[tensorrt]",
]

[project.urls]
Repository = "https://github.com/s0966066980/nova-avatar"

[dependency-groups]
dev = [
    "import-linter==2.15",
    "pyright==1.1.414",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff==0.17.1",
]
# Import probes used by the offline integration check; the full MuseTalk
# training/runtime extra is unnecessary for these CPU tests.
ci = [
    "einops==0.8.1",
    "ffmpeg-python>=0.2.0",
    # Match the pinned torch release even if newer audio wheels relax metadata.
    "torchaudio==2.5.0",
]

[tool.uv.sources]
nova-contracts = { path = "contracts", editable = true }
nova-core = { path = "core", editable = true }
nova-stt = { path = "services/stt", editable = true }
nova-llm = { path = "services/llm", editable = true }
nova-tts = { path = "services/tts", editable = true }
nova-render = { path = "avatar", editable = true }
nova-avatar-musetalk = { path = "avatar/nova_render/musetalk", editable = true }
torch = [
    { index = "pytorch-cu124" },
]
torchvision = [
    { index = "pytorch-cu124" },
]
torchaudio = [
    { index = "pytorch-cu124" },
]

[tool.pytest.ini_options]
markers = [
    "avatar: MuseTalk transition and rendering behavior",
    "conversation: reply protocol, streaming, media, playback, and voice-session behavior",
    "governance: branding, licensing, packaging, and integration audit contracts",
    "llm: model routing, profiles, normalization, and local model lifecycle",
    "ragflow: optional RAGFlow integration behavior",
    "runtime: server health, runtime settings, and optional dependency contracts",
    "speech: ASR, VAD, TTS, and speech worker behavior",
    "slow: deterministic tests that normally take at least one second",
    "live: opt-in tests that use an explicitly configured external model",
    "gpu: tests that need a GPU, real model weights or a local model server; run with -m gpu",
]
# A GPU-less machine without model weights runs the whole default suite; ``-m gpu``
# on the command line replaces this selection.
addopts = '-m "not gpu"'
# Each folder owns its tests (spec decision 5); ``pytest <folder>`` runs one of them.
testpaths = [
    "core/tests",
    "avatar/tests",
    "services/stt/tests",
    "services/llm/tests",
    "services/tts/tests",
    "tests",
]
# Package roots first, so a checkout runs without editable installs of the
# layers; then every tests folder, whose helper modules (*_fakes.py,
# access_helpers.py) are imported by module name; then the script folders whose
# modules the tests import.
pythonpath = [
    "contracts",
    "core",
    "avatar",
    "services/stt",
    "services/llm",
    "services/tts",
    "core/tests",
    "avatar/tests",
    "services/stt/tests",
    "services/llm/tests",
    "services/tts/tests",
    "services/llm/scripts",
    "services/tts/scripts",
]

# Processing-layer boundaries (ADR 0027). Layers: STT = nova_stt
# (services/stt); LLM = nova_llm, which holds the ragflow and web_search
# sub-packages (services/llm); TTS = nova_tts (services/tts); avatar rendering =
# nova_render, which holds the scene sub-package (avatar). Core = nova_core
# (core): server, profiles, config, greetings, vad, utils. Every layer may
# import nova_core.utils. nova_contracts (contracts/) is shared by all and
# imports none of them.
# No contract has ignore_imports. A new entry must name the ticket that
# removes it (CODING_STANDARDS.md rule 6); an entry that no longer matches
# fails the run.
[tool.importlinter]
root_packages = ["nova_core", "nova_stt", "nova_llm", "nova_tts", "nova_render", "nova_contracts"]

[[tool.importlinter.contracts]]
id = "contracts-are-a-leaf"
name = "nova_contracts imports no Nova Avatar code"
type = "forbidden"
source_modules = ["nova_contracts"]
forbidden_modules = ["nova_core", "nova_stt", "nova_llm", "nova_tts", "nova_render"]

[[tool.importlinter.contracts]]
id = "layers-not-core"
name = "Processing layers do not import the core"
type = "forbidden"
source_modules = [
    "nova_stt",
    "nova_llm",
    "nova_tts",
    "nova_render",
]
forbidden_modules = [
    "nova_core.server",
    "nova_core.profiles",
    "nova_core.config",
    "nova_core.greetings",
    "nova_core.vad",
]

# The cross-layer contracts check direct imports only: a path through the core
# is already caught above, and nova_core.utils is kept free of layer imports below.
[[tool.importlinter.contracts]]
id = "stt-not-other-layers"
name = "STT layer does not import other processing layers"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["nova_stt"]
forbidden_modules = [
    "nova_llm",
    "nova_tts",
    "nova_render",
]

[[tool.importlinter.contracts]]
id = "llm-not-other-layers"
name = "LLM layer does not import other processing layers"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["nova_llm"]
forbidden_modules = [
    "nova_stt",
    "nova_tts",
    "nova_render",
]

[[tool.importlinter.contracts]]
id = "tts-not-other-layers"
name = "TTS layer does not import other processing layers"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["nova_tts"]
forbidden_modules = [
    "nova_stt",
    "nova_llm",
    "nova_render",
]

[[tool.importlinter.contracts]]
id = "avatar-not-other-layers"
name = "Avatar rendering layer does not import other processing layers"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["nova_render"]
forbidden_modules = [
    "nova_stt",
    "nova_llm",
    "nova_tts",
]

[[tool.importlinter.contracts]]
id = "utils-is-shared-leaf"
name = "nova_core.utils imports neither processing layers nor the rest of the core"
type = "forbidden"
source_modules = ["nova_core.utils"]
forbidden_modules = [
    "nova_stt",
    "nova_llm",
    "nova_tts",
    "nova_render",
    "nova_core.server",
    "nova_core.profiles",
    "nova_core.config",
    "nova_core.greetings",
    "nova_core.vad",
]

# Converted layers (ticket 07): the core reaches the layer only through
# nova_<layer>.adapter (its in-process service) and nova_<layer>.config_section.
# One block per layer, id "<layer>-internals-private"; protected_modules lists
# every other module of the layer (tests/test_layer_entry_points.py fails when
# one is missing) and allowed_importers lists the layer's packages.

[[tool.importlinter.contracts]]
id = "stt-internals-private"
name = "Only the STT layer imports its internals; the core uses its adapter and config section"
type = "protected"
protected_modules = [
    "nova_stt.base",
    "nova_stt.engines",
    "nova_stt.factory",
]
allowed_importers = ["nova_stt"]

[[tool.importlinter.contracts]]
id = "llm-internals-private"
name = "Only the LLM layer imports its internals; the core uses its adapter and config section"
type = "protected"
protected_modules = [
    "nova_llm.base",
    "nova_llm.context_usage",
    "nova_llm.endpoints",
    "nova_llm.engines",
    "nova_llm.factory",
    "nova_llm.greeting",
    "nova_llm.handoff",
    "nova_llm.history",
    "nova_llm.identity_policy",
    "nova_llm.llamacpp",
    "nova_llm.llamacpp_protocol",
    "nova_llm.prewarm",
    "nova_llm.prompts",
    "nova_llm.reply_contract",
    "nova_llm.reply_events",
    "nova_llm.request_context",
    "nova_llm.response_protocol",
    "nova_llm.router",
    "nova_llm.rules",
    "nova_llm.service",
    "nova_llm.text_normalizer",
    "nova_llm.tools",
    "nova_llm.web_reply",
    "nova_llm.ragflow",
    "nova_llm.web_search",
]
allowed_importers = ["nova_llm"]


[[tool.importlinter.contracts]]
id = "tts-internals-private"
name = "Only the TTS layer imports its internals; the core uses its adapter and config section"
type = "protected"
protected_modules = [
    "nova_tts.base",
    "nova_tts.cosyvoice_runtime",
    "nova_tts.edge_connection",
    "nova_tts.edge_endpoint",
    "nova_tts.engines",
    "nova_tts.factory",
    "nova_tts.pcm_emitter",
    "nova_tts.retry",
    "nova_tts.training",
    "nova_tts.voice_library",
    "nova_tts.voice_models",
    "nova_tts.voice_preview",
]
allowed_importers = ["nova_tts"]


[[tool.importlinter.contracts]]
id = "avatar-internals-private"
name = "Only the avatar rendering layer imports its internals; the core uses its adapter and config section"
type = "protected"
protected_modules = [
    "nova_render.asset_io",
    "nova_render.audio_stream_handler",
    "nova_render.base",
    "nova_render.builder",
    "nova_render.catalog",
    "nova_render.factory",
    "nova_render.fake",
    "nova_render.mouth_quality",
    "nova_render.musetalk",
    "nova_render.video_output",
    "nova_render.scene",
]
allowed_importers = ["nova_render"]

[tool.ruff]
required-version = "==0.17.1"
target-version = "py310"
include = [
    "core/**/*.py",
    "avatar/**/*.py",
    "services/**/*.py",
    "contracts/**/*.py",
    "scripts/**/*.py",
    "tests/**/*.py",
    "conftest.py",
]
force-exclude = true
extend-exclude = [
    "avatar/nova_render/musetalk/utils",
    "avatar/nova_render/musetalk/whisper",
]

[tool.ruff.lint]
# Start with syntax/control-flow errors and undefined names. Style and unused
# code cleanup can be introduced separately without rewriting inherited code.
select = [
    "E9",
    "F63",
    "F7",
    "F82",
    # Security subset: exec, requests without timeout, pickle, urlopen schemes,
    # shell commands.
    "S102",
    "S113",
    "S301",
    "S310",
    "S605",
    # Blocking HTTP, subprocess, file, os.path, and sleep calls in async code.
    "ASYNC210",
    "ASYNC220",
    "ASYNC230",
    "ASYNC240",
    "ASYNC251",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"conftest.py" = ["S101"]

[tool.pyright]
# Control-flow guard for the server package: basic mode minus the rules that
# still report existing type-annotation debt there. Every rule left enabled
# passes with zero findings, so a new hit is a real regression.
include = ["core/nova_core/server"]
# Resolve the in-repo packages without requiring editable installs.
extraPaths = ["contracts", "core", "avatar", "services/stt", "services/llm", "services/tts"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportPossiblyUnboundVariable = "error"
# Import resolution depends on which optional extras are installed.
reportMissingImports = "none"
reportMissingModuleSource = "none"
# Existing debt in core/nova_core/server; enable once cleaned up.
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportCallIssue = "none"
reportGeneralTypeIssues = "none"
reportOptionalMemberAccess = "none"
reportReturnType = "none"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

# The root project is the application: it ships no Python package of its own
# (the code lives in core/, avatar/, services/ and contracts/), and an explicit
# empty list stops setuptools from auto-discovering those folders.
[tool.setuptools]
packages = []

[build-system]
requires = ["setuptools==69.5.1", "wheel"]
build-backend = "setuptools.build_meta"
