[project]
name = "nova-avatar"
version = "1.0.0"
description = "Real-time full-duplex conversational digital human framework"
readme = "README.md"
requires-python = ">=3.10, <3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "HongXian0903" }
]
maintainers = [
    { name = "HongXian0903" }
]

dependencies = [
    "regex>=2024.11.6",
    "aiohttp",
    "aiortc",
    "av",
    "edge-tts",
    "faster-whisper>=1.1",
    "onnxruntime>=1.16,<1.24",
    "librosa",
    "omegaconf",
    "opencc>=1.1.9",
    "openai",
    "numpy<2",
    "opencv-python-headless<4.12",
    "Pillow>=10,<13",
    "pydantic",
    "PyYAML",
    "scipy",
    "soundfile==0.12.1",
    "torch==2.5.0",
    "torchvision",
    "torchaudio",
    "tqdm",
    "typing-extensions",
    "websockets==12.0",
    "resampy",
    "logger",
    # mmengine/mmpose still import pkg_resources; setuptools>=82 removed it.
    "setuptools==69.5.1",
    "transformers==4.46.0",
    "pypdfium2==5.14.0",
]

# 服務端 VAD 依賴（按需安裝：uv pip install -e ".[vad]"）
[project.optional-dependencies]
vad = [
    "silero-vad>=5.1",           # Silero VAD，pip 包自帶模型，可離線使用
]
musetalk = [
    "nova-avatar-musetalk",
]
tensorrt = [
    # Keep the builder/runtime identical; engines must be rebuilt on upgrades.
    "tensorrt-cu12==10.16.1.11; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "onnx==1.17.0",
]

[project.urls]
Repository = "https://github.com/s0966066980/nova-avatar"

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest>=8",
    "ruff==0.17.1",
]
# Import probes used by the offline integration check; the full MuseTalk
# training/runtime extra is unnecessary for these CPU tests.
ci = [
    "einops==0.8.1",
    "ffmpeg-python>=0.2.0",
    # Match the pinned torch release even if newer audio wheels relax metadata.
    "torchaudio==2.5.0",
]

[tool.uv.sources]
nova-avatar-musetalk = { path = "src/avatars/musetalk", editable = true }
torch = [
    { index = "pytorch-cu124" },
]
torchvision = [
    { index = "pytorch-cu124" },
]
torchaudio = [
    { index = "pytorch-cu124" },
]

[tool.pytest.ini_options]
markers = [
    "avatar: MuseTalk transition and rendering behavior",
    "conversation: reply protocol, streaming, media, playback, and voice-session behavior",
    "governance: branding, licensing, packaging, and integration audit contracts",
    "llm: model routing, profiles, normalization, and local model lifecycle",
    "ragflow: optional RAGFlow integration behavior",
    "runtime: server health, runtime settings, and optional dependency contracts",
    "speech: ASR, VAD, TTS, and speech worker behavior",
    "slow: deterministic tests that normally take at least one second",
    "live: opt-in tests that use an explicitly configured external model",
]

[tool.ruff]
required-version = "==0.17.1"
target-version = "py310"
include = ["src/**/*.py", "scripts/**/*.py", "tests/**/*.py"]
force-exclude = true
extend-exclude = [
    "src/avatars/ernerf",
    "src/avatars/talkinggaussian",
    "src/avatars/ultralight",
    "src/avatars/wav2lip",
    "src/avatars/musetalk/utils",
    "src/avatars/musetalk/whisper",
]

[tool.ruff.lint]
# Start with syntax/control-flow errors and undefined names. Style and unused
# code cleanup can be introduced separately without rewriting inherited code.
select = [
    "E9",
    "F63",
    "F7",
    "F82",
    # Security subset: exec, requests without timeout, pickle, urlopen schemes,
    # shell commands.
    "S102",
    "S113",
    "S301",
    "S310",
    "S605",
    # Blocking HTTP, subprocess, file, os.path, and sleep calls in async code.
    "ASYNC210",
    "ASYNC220",
    "ASYNC230",
    "ASYNC240",
    "ASYNC251",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
# Control-flow guard for the server package: basic mode minus the rules that
# still report existing type-annotation debt there. Every rule left enabled
# passes with zero findings, so a new hit is a real regression.
include = ["src/server"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportPossiblyUnboundVariable = "error"
# Import resolution depends on which optional extras are installed.
reportMissingImports = "none"
reportMissingModuleSource = "none"
# Existing debt in src/server; enable once cleaned up.
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportCallIssue = "none"
reportGeneralTypeIssues = "none"
reportOptionalMemberAccess = "none"
reportReturnType = "none"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["setuptools==69.5.1", "wheel"]
build-backend = "setuptools.build_meta"
