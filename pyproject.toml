[project]
name = "nova-avatar"
version = "1.0.0"
description = "Real-time full-duplex conversational digital human framework"
readme = "README.md"
requires-python = ">=3.10, <3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "HongXian0903" }
]
maintainers = [
    { name = "HongXian0903" }
]

dependencies = [
    # Cross-layer contracts (ADR 0028); a path dependency sharing this uv.lock.
    "nova-contracts",
    "regex>=2024.11.6",
    "aiohttp",
    "aiortc",
    "av",
    "edge-tts",
    "ddgs==9.14.4",
    "faster-whisper>=1.1",
    "onnxruntime>=1.16,<1.24",
    "librosa",
    "omegaconf",
    "opencc>=1.1.9",
    "openai",
    "numpy<2",
    "opencv-python-headless<4.12",
    "Pillow>=10,<13",
    "pydantic",
    "PyYAML",
    "scipy",
    # CPU runtime for Matcha voice models (聲線模型); see src/tts/voice_models.py.
    "sherpa-onnx==2.0.1",
    "soundfile==0.12.1",
    "torch==2.5.0",
    "torchvision",
    "torchaudio",
    "tqdm",
    "typing-extensions",
    "websockets==12.0",
    "resampy",
    "logger",
    # mmengine/mmpose still import pkg_resources; setuptools>=82 removed it.
    "setuptools==69.5.1",
    "transformers==4.46.0",
    "pypdfium2==5.14.0",
]

# 服務端 VAD 依賴（按需安裝：uv pip install -e ".[vad]"）
[project.optional-dependencies]
vad = [
    "silero-vad>=5.1",           # Silero VAD，pip 包自帶模型，可離線使用
]
musetalk = [
    "nova-avatar-musetalk",
]
tensorrt = [
    # Keep the builder/runtime identical; engines must be rebuilt on upgrades.
    "tensorrt-cu12==10.16.1.11; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "onnx==1.17.0",
]

[project.urls]
Repository = "https://github.com/s0966066980/nova-avatar"

[dependency-groups]
dev = [
    "import-linter==2.15",
    "pyright==1.1.414",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff==0.17.1",
]
# Import probes used by the offline integration check; the full MuseTalk
# training/runtime extra is unnecessary for these CPU tests.
ci = [
    "einops==0.8.1",
    "ffmpeg-python>=0.2.0",
    # Match the pinned torch release even if newer audio wheels relax metadata.
    "torchaudio==2.5.0",
]

[tool.uv.sources]
nova-contracts = { path = "contracts", editable = true }
nova-avatar-musetalk = { path = "src/avatars/musetalk", editable = true }
torch = [
    { index = "pytorch-cu124" },
]
torchvision = [
    { index = "pytorch-cu124" },
]
torchaudio = [
    { index = "pytorch-cu124" },
]

[tool.pytest.ini_options]
markers = [
    "avatar: MuseTalk transition and rendering behavior",
    "conversation: reply protocol, streaming, media, playback, and voice-session behavior",
    "governance: branding, licensing, packaging, and integration audit contracts",
    "llm: model routing, profiles, normalization, and local model lifecycle",
    "ragflow: optional RAGFlow integration behavior",
    "runtime: server health, runtime settings, and optional dependency contracts",
    "speech: ASR, VAD, TTS, and speech worker behavior",
    "slow: deterministic tests that normally take at least one second",
    "live: opt-in tests that use an explicitly configured external model",
]

# Processing-layer boundaries (ADR 0027). Layers: STT = src.asr; LLM =
# src.llm, src.ragflow, src.web_search; TTS = src.tts; avatar rendering =
# src.avatars, src.scene. Core = src.server, src.profiles, src.config,
# src.greetings, src.vad, src.utils. Every layer may import src.utils.
# nova_contracts (contracts/) is shared by all and imports none of them.
# No contract has ignore_imports. A new entry must name the ticket that
# removes it (CODING_STANDARDS.md rule 6); an entry that no longer matches
# fails the run.
[tool.importlinter]
root_packages = ["src", "nova_contracts"]

[[tool.importlinter.contracts]]
id = "contracts-are-a-leaf"
name = "nova_contracts imports no Nova Avatar code"
type = "forbidden"
source_modules = ["nova_contracts"]
forbidden_modules = ["src"]

[[tool.importlinter.contracts]]
id = "layers-not-core"
name = "Processing layers do not import the core"
type = "forbidden"
source_modules = [
    "src.asr",
    "src.llm",
    "src.ragflow",
    "src.web_search",
    "src.tts",
    "src.avatars",
    "src.scene",
]
forbidden_modules = [
    "src.server",
    "src.profiles",
    "src.config",
    "src.greetings",
    "src.vad",
]

# The cross-layer contracts check direct imports only: a path through the core
# is already caught above, and src.utils is kept free of layer imports below.
[[tool.importlinter.contracts]]
id = "stt-not-other-layers"
name = "STT layer does not import other processing layers"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["src.asr"]
forbidden_modules = [
    "src.llm",
    "src.ragflow",
    "src.web_search",
    "src.tts",
    "src.avatars",
    "src.scene",
]

[[tool.importlinter.contracts]]
id = "llm-not-other-layers"
name = "LLM layer does not import other processing layers"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["src.llm", "src.ragflow", "src.web_search"]
forbidden_modules = [
    "src.asr",
    "src.tts",
    "src.avatars",
    "src.scene",
]

[[tool.importlinter.contracts]]
id = "tts-not-other-layers"
name = "TTS layer does not import other processing layers"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["src.tts"]
forbidden_modules = [
    "src.asr",
    "src.llm",
    "src.ragflow",
    "src.web_search",
    "src.avatars",
    "src.scene",
]

[[tool.importlinter.contracts]]
id = "avatar-not-other-layers"
name = "Avatar rendering layer does not import other processing layers"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["src.avatars", "src.scene"]
forbidden_modules = [
    "src.asr",
    "src.llm",
    "src.ragflow",
    "src.web_search",
    "src.tts",
]

[[tool.importlinter.contracts]]
id = "utils-is-shared-leaf"
name = "src.utils imports neither processing layers nor the rest of the core"
type = "forbidden"
source_modules = ["src.utils"]
forbidden_modules = [
    "src.asr",
    "src.llm",
    "src.ragflow",
    "src.web_search",
    "src.tts",
    "src.avatars",
    "src.scene",
    "src.server",
    "src.profiles",
    "src.config",
    "src.greetings",
    "src.vad",
]

# Converted layers (ticket 07): the core reaches the layer only through
# src.<layer>.adapter (its in-process service) and src.<layer>.config_section.
# One block per layer, id "<layer>-internals-private"; protected_modules lists
# every other module of the layer (tests/test_layer_entry_points.py fails when
# one is missing) and allowed_importers lists the layer's packages.

[[tool.importlinter.contracts]]
id = "stt-internals-private"
name = "Only the STT layer imports its internals; the core uses its adapter and config section"
type = "protected"
protected_modules = [
    "src.asr.base",
    "src.asr.engines",
    "src.asr.factory",
]
allowed_importers = ["src.asr"]

[[tool.importlinter.contracts]]
id = "llm-internals-private"
name = "Only the LLM layer imports its internals; the core uses its adapter and config section"
type = "protected"
protected_modules = [
    "src.llm.base",
    "src.llm.context_usage",
    "src.llm.endpoints",
    "src.llm.engines",
    "src.llm.factory",
    "src.llm.greeting",
    "src.llm.handoff",
    "src.llm.history",
    "src.llm.identity_policy",
    "src.llm.llamacpp",
    "src.llm.llamacpp_protocol",
    "src.llm.prewarm",
    "src.llm.prompts",
    "src.llm.reply_contract",
    "src.llm.reply_events",
    "src.llm.request_context",
    "src.llm.response_protocol",
    "src.llm.router",
    "src.llm.rules",
    "src.llm.service",
    "src.llm.text_normalizer",
    "src.llm.tools",
    "src.llm.web_reply",
    "src.ragflow.client",
    "src.ragflow.selection",
    "src.web_search.ddgs_adapter",
    "src.web_search.planner",
    "src.web_search.service",
    "src.web_search.synthesis",
]
allowed_importers = ["src.llm", "src.ragflow", "src.web_search"]


[[tool.importlinter.contracts]]
id = "tts-internals-private"
name = "Only the TTS layer imports its internals; the core uses its adapter and config section"
type = "protected"
protected_modules = [
    "src.tts.base",
    "src.tts.cosyvoice_runtime",
    "src.tts.edge_connection",
    "src.tts.edge_endpoint",
    "src.tts.engines",
    "src.tts.factory",
    "src.tts.pcm_emitter",
    "src.tts.retry",
    "src.tts.training",
    "src.tts.voice_library",
    "src.tts.voice_models",
    "src.tts.voice_preview",
]
allowed_importers = ["src.tts"]


[[tool.importlinter.contracts]]
id = "avatar-internals-private"
name = "Only the avatar rendering layer imports its internals; the core uses its adapter and config section"
type = "protected"
protected_modules = [
    "src.avatars.asset_io",
    "src.avatars.audio_stream_handler",
    "src.avatars.base",
    "src.avatars.builder",
    "src.avatars.catalog",
    "src.avatars.factory",
    "src.avatars.fake",
    "src.avatars.mouth_quality",
    "src.avatars.musetalk",
    "src.avatars.video_output",
    "src.scene.role_presentation",
    "src.scene.service",
]
allowed_importers = ["src.avatars", "src.scene"]

[tool.ruff]
required-version = "==0.17.1"
target-version = "py310"
include = ["src/**/*.py", "scripts/**/*.py", "tests/**/*.py", "contracts/**/*.py"]
force-exclude = true
extend-exclude = [
    "src/avatars/musetalk/utils",
    "src/avatars/musetalk/whisper",
]

[tool.ruff.lint]
# Start with syntax/control-flow errors and undefined names. Style and unused
# code cleanup can be introduced separately without rewriting inherited code.
select = [
    "E9",
    "F63",
    "F7",
    "F82",
    # Security subset: exec, requests without timeout, pickle, urlopen schemes,
    # shell commands.
    "S102",
    "S113",
    "S301",
    "S310",
    "S605",
    # Blocking HTTP, subprocess, file, os.path, and sleep calls in async code.
    "ASYNC210",
    "ASYNC220",
    "ASYNC230",
    "ASYNC240",
    "ASYNC251",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
# Control-flow guard for the server package: basic mode minus the rules that
# still report existing type-annotation debt there. Every rule left enabled
# passes with zero findings, so a new hit is a real regression.
include = ["src/server"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportPossiblyUnboundVariable = "error"
# Import resolution depends on which optional extras are installed.
reportMissingImports = "none"
reportMissingModuleSource = "none"
# Existing debt in src/server; enable once cleaned up.
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportCallIssue = "none"
reportGeneralTypeIssues = "none"
reportOptionalMemberAccess = "none"
reportReturnType = "none"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["setuptools==69.5.1", "wheel"]
build-backend = "setuptools.build_meta"
