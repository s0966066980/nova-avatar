# Overlay for upstream RAGFlow v0.27.2. Compose v2.40+ is required for !override.
# Only RAGFlow's UI and retrieval API are reachable on the host, both loopback.
services:
  ragflow-cpu:
    ports: !override
      - "127.0.0.1:8088:80"
      - "127.0.0.1:9380:9380"
    cpus: 4.0
    mem_limit: 6g
    environment:
      API_PROXY_SCHEME: python
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9380/api/v1/system/ping"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 12

  es01:
    ports: !override []
    cpus: 2.0

  mysql:
    ports: !override []
    cpus: 1.0
    mem_limit: 1g

  minio:
    ports: !override []
    cpus: 1.0
    mem_limit: 1g

  redis:
    ports: !override []
    cpus: 0.5
    mem_limit: 256m
