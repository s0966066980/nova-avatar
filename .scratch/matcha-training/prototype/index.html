<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: console shell (rail + one full-width card). A six-step wizard lives inside the card;
   tokens mirror web/src/console-prototype.css so the prototype reads as the real console. */
:root {
  --font-cjk: "Noto Sans TC", "Noto Sans CJK TC", "WenQuanYi Zen Hei", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-latin: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", "Noto Sans Mono CJK TC", "SF Mono", Consolas, monospace;
  --font-main: var(--font-latin), var(--font-cjk);
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
  --anim-fast: 150ms cubic-bezier(0.2, 0.8, 0.2, 1);

  --bg-page: #f3f5f9; --bg-surface: #ffffff; --bg-raised: #f7f8fb; --bg-sunken: #edf0f5;
  --bg-input: #ffffff; --bg-hover: #e8ecf3; --bg-active: #dfe4ec;
  --border: #d6dce6; --border-strong: #aeb8c8;
  --text: #111827; --text-2: #3b4556; --text-3: #5b6577;
  --brand: #3b5bdb; --brand-hover: #2f4ac0; --brand-surface: #edf1ff; --brand-ink: #2a44b0; --on-brand: #ffffff;
  --ok: #0b7a4b; --ok-surface: #e6f6ee; --ok-border: #9ed9bc;
  --warn: #8a5300; --warn-bar: #e3a43a; --warn-surface: #fff4dc; --warn-border: #f0c46b;
  --danger: #b42318; --danger-surface: #fdecea; --danger-border: #f3a49c; --on-danger: #ffffff;
  --idle: #64748b;
  --shadow-color: rgba(16, 24, 40, 0.08);
  --shadow-1: 0 1px 2px var(--shadow-color), 0 1px 3px var(--shadow-color);
  --focus-ring: var(--brand);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-page: #08090c; --bg-surface: #10141c; --bg-raised: #161b25; --bg-sunken: #0b0e14;
    --bg-input: #0c1017; --bg-hover: #1d2431; --bg-active: #253042;
    --border: #262e3c; --border-strong: #3e4a5e;
    --text: #eef1f6; --text-2: #b9c2d0; --text-3: #8c97a8;
    --brand: #7c9cff; --brand-hover: #9ab3ff; --brand-surface: #1c2440; --brand-ink: #a9bdff; --on-brand: #0a0f1f;
    --ok: #3ddc97; --ok-surface: #0f2a22; --ok-border: #1f6b4c;
    --warn: #f2b544; --warn-bar: #f2b544; --warn-surface: #2a2414; --warn-border: #725b26;
    --danger: #ff6b6b; --danger-surface: #2d1a20; --danger-border: #7d3a40; --on-danger: #1f0808;
    --idle: #8fa3bf; --shadow-color: rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg-page: #08090c; --bg-surface: #10141c; --bg-raised: #161b25; --bg-sunken: #0b0e14;
  --bg-input: #0c1017; --bg-hover: #1d2431; --bg-active: #253042;
  --border: #262e3c; --border-strong: #3e4a5e;
  --text: #eef1f6; --text-2: #b9c2d0; --text-3: #8c97a8;
  --brand: #7c9cff; --brand-hover: #9ab3ff; --brand-surface: #1c2440; --brand-ink: #a9bdff; --on-brand: #0a0f1f;
  --ok: #3ddc97; --ok-surface: #0f2a22; --ok-border: #1f6b4c;
  --warn: #f2b544; --warn-bar: #f2b544; --warn-surface: #2a2414; --warn-border: #725b26;
  --danger: #ff6b6b; --danger-surface: #2d1a20; --danger-border: #7d3a40; --on-danger: #1f0808;
  --idle: #8fa3bf; --shadow-color: rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg-page); color: var(--text); font: 14px/1.5 var(--font-main); letter-spacing: 0.01em; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p, ul, ol, dl, figure, fieldset, blockquote { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.mono { font-family: var(--font-mono); font-size: 0.92em; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 1.15em; height: 1.15em; flex: none; vertical-align: -0.2em; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.wrap { padding-block: 0 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 12px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.brand { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.crumb { color: var(--text-3); font-size: 13px; min-width: 0; overflow-wrap: anywhere; }
.top .grow { flex: 1; }

/* prototype controls */
.proto { border: 1px dashed var(--border-strong); border-radius: var(--radius-md); background: var(--bg-raised); margin-bottom: 14px; }
.proto > summary { padding: 10px 14px; cursor: pointer; font-weight: 600; font-size: 13px; }
.proto-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 22px; padding: 4px 14px 14px; }
.proto fieldset { border: 0; display: grid; gap: 6px; min-width: 0; align-content: start; }
.proto legend { font-size: 12px; font-weight: 700; color: var(--text-3); margin-bottom: 4px; letter-spacing: 0.04em; }
.proto label { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.proto select { width: 100%; }
.proto .note { font-size: 12px; color: var(--text-3); grid-column: 1 / -1; }
.jumps { display: flex; flex-wrap: wrap; gap: 6px; }

/* shell */
.shell { display: grid; grid-template-columns: 224px minmax(0, 1fr); gap: 16px; align-items: start; }
.rail { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 10px; display: flex; flex-direction: column; gap: 2px; box-shadow: var(--shadow-1); position: sticky; top: 8px; }
.rail-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius-sm); color: var(--text-2); font-size: 13px; font-weight: 500; }
.rail-item.active { background: var(--brand-surface); color: var(--brand-ink); font-weight: 700; }
.rail-badge { margin-left: auto; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--text-3); white-space: nowrap; }
.rail-item.active .rail-badge { border-color: var(--brand); color: var(--brand-ink); }
main { min-width: 0; display: grid; gap: 16px; }

/* card family */
.card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow-1); min-width: 0; }
.card-title-row { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px 14px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
.card-title-row > :first-child { flex: 1 1 15rem; min-width: 0; }
.card-title-text { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card-title-text h2 { font-size: inherit; font-weight: inherit; }
.card-title-text .ic { color: var(--brand); font-size: 17px; }
.card-subtitle-desc { font-size: 12.5px; color: var(--text-3); margin-top: 3px; line-height: 1.6; max-width: 70ch; }
h2[tabindex="-1"]:focus { outline: none; }
.section-title { font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.section-title .ic { color: var(--brand); }
.hint { font-size: 12.5px; color: var(--text-3); line-height: 1.6; overflow-wrap: anywhere; }
.footnote { font-size: 12px; color: var(--text-3); line-height: 1.6; }
.stack { display: grid; gap: 12px; min-width: 0; }
.lab-block { display: grid; gap: 4px; justify-items: end; min-width: 0; }
.row-wrap { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; min-width: 0; }
.section { border-top: 1px solid var(--border); padding-top: 14px; display: grid; gap: 12px; min-width: 0; }

/* buttons */
.btn { min-height: 36px; padding: 7px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--bg-surface); color: var(--text); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: left; line-height: 1.35; transition: background-color var(--anim-fast), border-color var(--anim-fast); }
.btn:hover { background: var(--bg-hover); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); font-weight: 700; }
.btn.primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
.btn.danger { border-color: var(--danger-border); color: var(--danger); }
.btn.danger-solid { background: var(--danger); border-color: var(--danger); color: var(--on-danger); }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 12.5px; }
.btn.icon { min-width: 36px; padding: 6px; }
.btn[aria-disabled="true"], .btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn[aria-disabled="true"]:hover { background: var(--bg-surface); }
.btn.primary[aria-disabled="true"]:hover { background: var(--brand); }
.btn[aria-pressed="true"] { background: var(--brand-surface); border-color: var(--brand); color: var(--brand-ink); }
.act-block { display: grid; gap: 6px; justify-items: start; min-width: 0; }
.why { display: flex; gap: 6px; align-items: flex-start; font-size: 12.5px; color: var(--warn); line-height: 1.5; }
.why .ic { margin-top: 2px; }
.foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; border-top: 1px solid var(--border); padding-top: 16px; align-items: flex-start; }
.foot .right { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; justify-content: flex-end; margin-left: auto; }

/* form controls */
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .field > .lbl, legend.lbl { font-size: 13px; font-weight: 600; }
.std-input, .std-select, .std-textarea { min-height: 36px; background: var(--bg-input); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 8px 12px; color: var(--text); font-size: 13px; width: 100%; transition: border-color var(--anim-fast), box-shadow var(--anim-fast); }
.std-textarea { resize: vertical; line-height: 1.6; }
.std-input:hover, .std-select:hover, .std-textarea:hover { border-color: var(--text-3); }
.std-input:focus, .std-select:focus, .std-textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-surface); outline: none; }
[aria-invalid="true"] { border-color: var(--danger) !important; box-shadow: 0 0 0 3px var(--danger-surface); }
.err { color: var(--danger); font-size: 12.5px; display: flex; gap: 6px; align-items: flex-start; }
fieldset.group { border: 0; display: grid; gap: 10px; min-width: 0; }
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: start; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg-surface); cursor: pointer; min-width: 0; }
.opt:hover { background: var(--bg-raised); }
.opt:has(input:checked) { border-color: var(--brand); background: var(--brand-surface); }
.opt:has(input:focus-visible) { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.opt input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--brand); }
.opt .t { font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.opt .d { grid-column: 2; font-size: 12.5px; color: var(--text-2); line-height: 1.6; }
.opt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.check { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; font-size: 13.5px; line-height: 1.6; padding: 12px 14px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--bg-raised); cursor: pointer; }
.check input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--brand); }

/* chips and banners */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-raised); color: var(--text-2); font-size: 12px; font-weight: 600; line-height: 1.4; }
.chip.ok { color: var(--ok); border-color: var(--ok-border); background: var(--ok-surface); }
.chip.warn { color: var(--warn); border-color: var(--warn-border); background: var(--warn-surface); }
.chip.danger { color: var(--danger); border-color: var(--danger-border); background: var(--danger-surface); }
.chip.busy { color: var(--brand-ink); border-color: var(--brand); background: var(--brand-surface); }
.chip.plain { padding-left: 10px; }
.tag-dev, .tag-res { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--warn-border); color: var(--warn); font-size: 12px; font-weight: 700; line-height: 1.4; }
.tag-dev { background: var(--warn-surface); border-color: var(--warn-bar); }
.tag-res { background: var(--bg-raised); }
.banner { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border: 1px solid var(--border); border-left-width: 4px; border-left-color: var(--brand); border-radius: var(--radius-md); background: var(--brand-surface); font-size: 13px; line-height: 1.6; min-width: 0; }
.banner > .ic { font-size: 18px; color: var(--brand-ink); margin-top: 2px; }
.banner > div { min-width: 0; flex: 1; overflow-wrap: anywhere; }
.banner.warn { border-color: var(--warn-border); border-left-color: var(--warn-bar); background: var(--warn-surface); }
.banner.warn > .ic { color: var(--warn); }
.banner.danger { border-color: var(--danger-border); border-left-color: var(--danger); background: var(--danger-surface); }
.banner.danger > .ic { color: var(--danger); }
.banner.ok { border-color: var(--ok-border); border-left-color: var(--ok); background: var(--ok-surface); }
.banner.ok > .ic { color: var(--ok); }
.banner .b-title { font-weight: 700; margin-bottom: 2px; }
.banner .b-actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }

/* stepper */
.steps { display: flex; flex-wrap: wrap; gap: 6px 4px; counter-reset: s; }
.steps li { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; color: var(--text-3); font-size: 12.5px; font-weight: 600; min-width: 0; }
.steps .sn { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--border-strong); display: grid; place-items: center; font-size: 12px; flex: none; font-variant-numeric: tabular-nums; }
.steps li.done { color: var(--text-2); }
.steps li.done .sn { background: var(--ok-surface); border-color: var(--ok-border); color: var(--ok); }
.steps li.cur { background: var(--brand-surface); color: var(--brand-ink); }
.steps li.cur .sn { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.steps li + li::before { content: none; }

/* source cards */
.src-card { display: grid; gap: 10px; align-content: start; }
.src-card .opt { height: 100%; }
.corpus-item, .model-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg-raised); }
.corpus-item .meta, .model-item .meta { font-size: 12.5px; color: var(--text-3); display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 2px; }
.corpus-item strong, .model-item strong { overflow-wrap: anywhere; }
.item-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.empty { border: 1px dashed var(--border-strong); border-radius: var(--radius-md); padding: 22px 18px; display: grid; gap: 10px; justify-items: start; background: var(--bg-raised); }
.empty h3 { font-size: 14px; }

/* quote */
.msa { border: 1px solid var(--warn-border); border-left: 4px solid var(--warn-bar); border-radius: var(--radius-md); background: var(--bg-raised); padding: 14px 16px; display: grid; gap: 8px; }
.msa .src { font-size: 12px; color: var(--text-3); font-weight: 600; letter-spacing: 0.03em; }
.msa blockquote { font-size: 15px; line-height: 1.7; font-weight: 600; overflow-wrap: anywhere; }
.rules { display: grid; gap: 8px; font-size: 13px; line-height: 1.6; }
.rules li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.rules .ic { color: var(--warn); margin-top: 3px; }

/* files */
.drop { border: 1.5px dashed var(--border-strong); border-radius: var(--radius-md); padding: 22px 16px; display: grid; gap: 8px; justify-items: start; background: var(--bg-raised); }
.flist { display: grid; gap: 6px; font-size: 13px; }
.frow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); align-items: center; background: var(--bg-surface); }
.frow .n { overflow-wrap: anywhere; }
.frow.rej { border-color: var(--danger-border); background: var(--danger-surface); }
.frow .reason { grid-column: 1 / -1; color: var(--danger); font-size: 12.5px; display: flex; gap: 6px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.kv > div { padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-raised); min-width: 0; }
.kv dt { font-size: 12px; color: var(--text-3); }
.kv dd { margin: 2px 0 0; font-weight: 600; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }

/* review grid */
.sumbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.rt { display: grid; gap: 0; border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
.rt-head, .rt-row { display: grid; grid-template-columns: 34px 84px minmax(0, 1fr) 118px minmax(150px, auto); gap: 12px; padding: 10px 14px; align-items: start; }
.rt-head { background: var(--bg-sunken); font-size: 12px; font-weight: 700; color: var(--text-3); letter-spacing: 0.03em; }
.rt-row { border-top: 1px solid var(--border); background: var(--bg-surface); }
.rt-row.is-exc { background: var(--bg-sunken); color: var(--text-3); }
.rt-row.is-exc .txt { text-decoration: line-through; text-decoration-color: var(--text-3); }
.rt-row.is-bad { background: var(--danger-surface); }
.rt-row.is-edit { background: var(--brand-surface); }
.rt .c-n { color: var(--text-3); font-variant-numeric: tabular-nums; padding-top: 6px; }
.rt .c-p { display: grid; gap: 2px; justify-items: start; }
.rt .dur { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.rt .c-t { display: grid; gap: 6px; min-width: 0; }
.rt .fid { font-size: 11.5px; color: var(--text-3); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.rt .txt { font-size: 14px; line-height: 1.7; overflow-wrap: anywhere; }
.rt .c-a { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.rt .c-s { padding-top: 3px; }
.exp { font-size: 12.5px; line-height: 1.7; color: var(--text-2); border-left: 3px solid var(--border-strong); padding-left: 10px; overflow-wrap: anywhere; }
mark.ex { background: var(--brand-surface); color: var(--brand-ink); border-radius: 3px; padding: 0 2px; text-decoration: underline; text-decoration-style: dotted; }
mark.bad { background: var(--danger-surface); color: var(--danger); border-radius: 3px; padding: 0 2px; font-weight: 700; text-decoration: underline wavy; }
.nt { font-size: 12.5px; color: var(--warn); display: flex; gap: 6px; align-items: flex-start; line-height: 1.5; }
.nt.bad { color: var(--danger); }
.pager { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

/* preflight */
.checks { display: grid; gap: 8px; }
.ck { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg-surface); }
.ck.bad { border-color: var(--danger-border); background: var(--danger-surface); }
.ck.warn { border-color: var(--warn-border); background: var(--warn-surface); }
.ck > .ic { font-size: 18px; margin-top: 2px; }
.ck.ok > .ic { color: var(--ok); }
.ck.bad > .ic { color: var(--danger); }
.ck.warn > .ic { color: var(--warn); }
.ck .k { font-weight: 600; }
.ck .v { font-size: 12.5px; color: var(--text-2); line-height: 1.6; overflow-wrap: anywhere; }
.ck .st { font-size: 12px; font-weight: 700; white-space: nowrap; }
.ck.ok .st { color: var(--ok); } .ck.bad .st { color: var(--danger); } .ck.warn .st { color: var(--warn); }

      g.gain.setValueAtTime(0.0001, tm); g.gain.exponentialRampToValueAtTime(0.05, tm + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, tm + 0.15);
      o.connect(g); g.connect(AC.destination); o.start(tm); o.stop(tm + 0.16); tm += 0.18;
    }
  } catch (e) { /* sound is optional */ }
}
function stopPlay() { clearTimeout(S.playT); S.playT = null; S.playing = null; S.pvPlaying = false; }
function fakePlay(sec, done, tick) {
  beep(sec); const t0 = Date.now();
  const iv = setInterval(() => { const f = Math.min(1, (Date.now() - t0) / (sec * 1000)); tick && tick(f); if (f >= 1) clearInterval(iv); }, 80);
  S.playT = setTimeout(() => { clearInterval(iv); S.playT = null; done(); }, sec * 1000);
}

/* ---------- job engine ---------- */
function startJob(silent) {
  S.job = { status: 'running', t: 0, stage: 0, log: [], failTitle: '', failBody: '' };
  S.job.log.push(...logLines(S.job, 0));
  S.confirmCancel = false;
  clearInterval(S.tmr); S.tmr = setInterval(jobTick, 700 / S.speed);
  if (!silent) go('job');
  else if (S.screen === 'job') render();
  S.result = null;
}
function jobTick() {
  const j = S.job; if (!j) return;
  if (j.status === 'cancelling') { j.cn = (j.cn || 0) + 1; if (j.cn >= 3) { j.status = 'cancelled'; clearInterval(S.tmr); j.log.push('<div><span class="t">[--:--:--] </span>子程序已停止，GPU 顯存已釋放</div>'); S.screen === 'job' ? render() : 0; if (S.screen === 'home') render(); announce('訓練已取消，GPU 顯存已釋放'); } return; }
  if (j.status !== 'running') return;
  j.t++;
  const total = totalTicks(), s = stageOf(j.t);
  const f = S.scen.jobFail;
  if (f === 'rate' && S.path === 'edge' && s.i === 1 && s.f > 0.55) return fail(j, 'Edge 連續拒絕合成要求', '連續 5 次重試仍收到 HTTP 429（請求過多）。已合成 ' + Math.round(s.f * totalLines()) + ' 句，GPU 沒有被佔用。請稍後再試，或改用「快速測試」減少句數。');
  if ((f === 'oom' || (f === 'rate' && S.path !== 'edge')) && s.i === 3 && s.f > 0.4) return fail(j, 'GPU 顯存不足', '訓練需要的顯存超過目前剩餘量（CUDA out of memory）。子程序已結束，GPU 已釋放。請關閉其他使用 GPU 的程式後，回到訓練前檢查再試。');
  if (j.t >= total) { j.status = 'succeeded'; clearInterval(S.tmr); S.result = makeResult(); j.log.push('<div><span class="t">[--:--:--] </span>訓練工作完成：' + esc(S.result.id) + '</div>'); if (S.screen === 'job' || S.screen === 'home') render(); announce('訓練完成'); return; }
  const prevStage = j.stage; j.stage = s.i;
  const lines = logLines(j, j.t); j.log.push(...lines);
  if (S.screen === 'job') {
    if (prevStage !== j.stage) { render(); announce('進入階段：' + stageName(j.stage)); return; }
    const log = $('#log'); if (log) { const atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 30; lines.forEach(l => log.insertAdjacentHTML('beforeend', l)); if (atEnd) log.scrollTop = log.scrollHeight; }
    const b = $('#jp-bar'); if (b) { b.setAttribute('aria-valuenow', pct()); b.firstElementChild.style.width = pct() + '%'; }
    const ti = $('#jp-title'); if (ti) ti.textContent = '整體進度 ' + pct() + '%';
    const e = $('#jp-eta'); if (e) e.textContent = etaText();
    const d = $('#st-' + j.stage + '-d'); if (d) d.textContent = stageDetail(j.stage, s.f, j.status);
  } else if (S.screen === 'home') { render(); }
}
function fail(j, title, body) {
  j.status = 'failed'; j.failTitle = title; j.failBody = body; clearInterval(S.tmr);
  j.log.push('<div class="e"><span class="t">[--:--:--] </span>' + esc(title) + '</div>');
  if (S.screen === 'job' || S.screen === 'home') render(); announce('訓練失敗：' + title);
}

/* ---------- events ---------- */
const H = {
  go: a => go(a),
  noop: () => announce('原型：這個動作沒有連到伺服器。'),
  newCorpus: () => { S.path = null; S.edge.confirmed = false; S.up = { declared: '', consent: false, note: '', loaded: false }; S.tr = { src: 'file', model: 'small', status: 'idle', progress: 0 }; S.rows = null; S.fresh = false; S.edge.txtLoaded = false; go('source'); },
  startEdge: () => { H.newCorpus(); S.path = 'edge'; render(); },
  startUpload: () => { H.newCorpus(); S.path = 'upload'; render(); },
  sourceNext: () => go(S.path === 'edge' ? 'edge-confirm' : 'upload'),
  pickUploadInstead: () => { S.path = 'upload'; S.edge.confirmed = false; go('upload'); },
  loadFiles: () => { S.up.loaded = true; render(); announce('已載入 38 個錄音檔'); },
  clearFiles: () => { S.up.loaded = false; render(); },
  loadTranscript: () => { S.tr.status = S.scen.csvError ? 'error' : 'done'; S.rows = null; render(); announce(S.scen.csvError ? 'metadata.csv 無法讀取' : '已對應 36 個錄音'); },
  startWhisper: () => {
    S.tr.status = 'running'; S.tr.progress = 0; render();
    clearInterval(S.wt);
    S.wt = setInterval(() => {
      if (S.scen.whisperFail && S.tr.progress >= 3) { clearInterval(S.wt); S.tr.status = 'error'; render(); announce('自動產生失敗'); return; }
      S.tr.progress = Math.min(38, S.tr.progress + 3);
      const b = $('#wp-bar'), tx = $('#wp-t');
      if (b) { b.setAttribute('aria-valuenow', S.tr.progress); b.firstElementChild.style.width = Math.round(S.tr.progress / 38 * 100) + '%'; }
      if (tx) tx.textContent = '正在辨識 ' + S.tr.progress + ' / 38 句…';
      if (S.tr.progress >= 38) { clearInterval(S.wt); S.tr.status = 'done'; S.rows = null; render(); announce('已產生 38 句逐字稿'); }
    }, 700 / S.speed);
  },
  cancelWhisper: () => { clearInterval(S.wt); S.tr.status = 'idle'; render(); },
  resetWhisper: () => { S.tr.status = 'idle'; S.rows = null; render(); },
  loadTxt: () => { S.edge.txtLoaded = true; S.rows = null; render(); announce('已讀入 38 行文字'); },
  clearTxt: () => { S.edge.txtLoaded = false; S.rows = null; render(); },
  toReview: () => { S.rows = null; S.filter = 'all'; S.page = 0; ensure('review'); if (S.path === 'edge' && S.edge.textSrc === 'file') S.rows = makeRows('file', false); else if (S.path === 'upload') S.rows = makeRows(S.tr.src, true); go('review'); },
  toggleSample: () => { S.edge.showSample = !S.edge.showSample; render(); },
  filter: a => { S.filter = a; S.page = 0; render(); },
  page: a => { S.page = Math.max(0, S.page + (+a)); render(); },
  confirmRow: id => { row(id).status = 'confirmed'; render(); announce('已確認 ' + id); },
  excludeRow: id => { row(id).status = 'excluded'; render(); announce('已排除 ' + id); },
  restoreRow: id => { row(id).status = 'pending'; render(); announce('已納回 ' + id + '，狀態為待確認'); },
  revertRow: id => { const r = row(id); r.text = r.raw; r.edited = false; r.status = 'pending'; render(); },
  editRow: id => { S.editing = id; S.editErr = ''; render(); const e = $('#ed-' + id); if (e) { e.focus(); e.setSelectionRange(e.value.length, e.value.length); } },
  cancelEdit: () => { S.editing = null; S.editErr = ''; render(); },
  saveEdit: id => {
    const v = ($('#ed-' + id).value || '').trim();
    if (!v) { S.editErr = '逐字稿不能是空白。請輸入錄音說出的內容，或改用「排除」。'; render(); $('#ed-' + id).focus(); return; }
    const r = row(id); r.edited = v !== r.raw; r.text = v; S.editErr = ''; S.editing = null;
    if (!info(v).bad.length) r.status = 'confirmed';
    render(); announce(info(v).bad.length ? '已儲存，但還有無法處理的數字' : '已儲存並確認 ' + id);
  },
  confirmAll: () => { let n = 0; S.rows.forEach(r => { if (rstat(r) === 'pend') { r.status = 'confirmed'; n++; } }); render(); announce('已確認 ' + n + ' 句'); },
  playRow: id => {
    if (S.playing === id) { stopPlay(); render(); return; }
    stopPlay(); S.playing = id; render(); const r = row(id);
    fakePlay(Math.min(r.dur, 2.2), () => { S.playing = null; if (S.screen === 'review') render(); });
  },
  recheck: () => { S.checking = true; render(); setTimeout(() => { S.checking = false; if (S.screen === 'preflight') { render(); announce('已重新檢查'); } }, 800); },
  startJob: () => startJob(),
  askCancel: () => { S.confirmCancel = true; render(); const b = $('[data-act="keepGoing"]'); b && b.focus(); },
  keepGoing: () => { S.confirmCancel = false; render(); },
  confirmCancel: () => { S.confirmCancel = false; S.job.status = 'cancelling'; S.job.cn = 0; render(); },
  copyLog: () => { const txt = $('#log').innerText; (navigator.clipboard && navigator.clipboard.writeText(txt).then(() => announce('已複製日誌'), () => announce('無法複製，請手動選取日誌'))) || announce('無法複製，請手動選取日誌'); },
  playPreview: () => {
    if (S.pvPlaying) { stopPlay(); render(); return; }
    const text = +S.pvIdx === 9 ? (S.pvCustom || '').trim() : PREV[+S.pvIdx || 0];
    if (!text) { announce('請先輸入自訂句子'); return; }
    S.pvPlaying = true; render(); const st = $('#pv-st'); if (st) st.textContent = '合成中…';
    const sec = Math.min(6, Math.max(1.6, text.length * 0.13));
    setTimeout(() => { if (!S.pvPlaying) return; const s2 = $('#pv-st'); if (s2) s2.textContent = '播放中（提示音代替語音）'; fakePlay(sec, () => { S.pvPlaying = false; if (S.screen === 'done') render(); }, f => { const p = $('#pv-prog'); if (p) p.style.width = (f * 100) + '%'; }); }, 500);
  },
  openCorpus: a => {
    S.fresh = false;
    if (a === 'job') return go('job');
    if (a === 'draft') { S.path = 'upload'; S.up = { declared: 'own', consent: true, note: '', loaded: true }; S.tr = { src: 'whisper', model: 'medium', status: 'done', progress: 38 }; S.rows = makeRows('whisper', true); S.rows.forEach((r, i) => { if (i < 30 && !info(r.text).bad.length) r.status = 'confirmed'; }); S.filter = 'pend'; S.page = 0; return go('review'); }
    if (a === 'doneold') { S.path = 'edge'; S.result = { name: 'edge-快速測試-0918', id: 'zh-tw-edge-test-01', usage: DEV, src: '測試用老師 · Edge' }; S.edge.confirmed = true; return go('done'); }
  }
};
const row = id => S.rows.find(r => r.id === id);

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
  const f = H[el.dataset.act]; if (f) f(el.dataset.arg, el);
});
document.addEventListener('change', e => {
  const el = e.target; if (!el.dataset || !el.dataset.bind) return;
  const b = el.dataset.bind, v = el.type === 'checkbox' ? el.checked : el.value;
  if (b === 'path') S.path = v;
  else if (b === 'edge.voice') S.edge.voice = v;
  else if (b === 'edge.preset') S.edge.preset = v;
  else if (b === 'edge.textSrc') { S.edge.textSrc = v; S.rows = null; }
  else if (b === 'edge.confirmed') S.edge.confirmed = v;
  else if (b === 'up.declared') { S.up.declared = v; S.up.consent = false; }
  else if (b === 'up.consent') S.up.consent = v;
  else if (b === 'up.note') S.up.note = v;
  else if (b === 'tr.src') { S.tr.src = v; S.tr.status = 'idle'; S.rows = null; }
  else if (b === 'tr.model') S.tr.model = v;
  else if (b === 'pv.idx') { S.pvIdx = v; stopPlay(); }
  render();
});
document.addEventListener('input', e => {
  const el = e.target, k = el.dataset && el.dataset.live; if (!k) return;
  if (k === 'edit') { const p = $('#ed-prev'); if (p) p.innerHTML = expLine(info(el.value)); }
  else if (k === 'name') { S.name = el.value; const c = $('#pf-checks'); const wasFocus = el.id; $('#pf-actions').innerHTML = pfActions(); const ne = nameErr(); const wrap = $('#ck-name'); if (wrap) { wrap.className = 'ck ' + (ne ? 'bad' : 'ok'); const ico = wrap.querySelector('svg use'); if (ico) ico.setAttribute('href', ne ? '#i-x-circle' : '#i-check-circle'); const v = $('#name-err'); if (v) v.innerHTML = ne ? '<span class="err">' + ic('x-circle') + ne + '</span>' : '聲線模型 ID 由伺服器依名稱產生，例如 <span class="mono">' + (S.path === 'edge' ? 'zh-tw-edge-test-02' : 'zh-tw-own-01') + '</span>，不能自行指定路徑。'; el.setAttribute('aria-invalid', ne && S.name ? 'true' : 'false'); const st = wrap.querySelector('.st'); if (st) st.textContent = ne ? t('fail') : t('pass'); } }
  else if (k === 'pvc') S.pvCustom = el.value;
});
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (S.confirmCancel) H.keepGoing(); else if (S.editing) H.cancelEdit(); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== S.screen && screens[h]) { S.fresh = true; S.screen = h; go(h); } });

/* ---------- prototype panel ---------- */
const JUMPS = [['home', '首頁'], ['source', '來源'], ['edge-confirm', 'Edge 確認'], ['upload', '上傳錄音'], ['text', '逐字稿／朗讀文字'], ['review', '校對'], ['preflight', '訓練前檢查'], ['job', '訓練進度'], ['done', '完成'], ['profile', '設定檔選用']];
const SCEN = [['empty', '首頁：空狀態（沒有語料與聲線模型）'], ['session', '管理者登入已失效'], ['rejected', '上傳檔案被拒絕（格式、大小、重名）'], ['csvError', 'metadata.csv 格式錯誤'], ['whisperFail', '自動產生逐字稿失敗'], ['stage', '有舞台連線'], ['vram', '剩餘顯存不足（6.1 GB）'], ['env', '訓練環境缺失'], ['busy', '已有其他訓練工作']];
function buildProto() {
  const b = $('#protoBody');
  b.innerHTML = '<fieldset><legend>跳到畫面（自動補上前面步驟的假資料）</legend><div class="jumps">' + JUMPS.map(j => '<button type="button" class="btn small" data-jump="' + j[0] + '">' + j[1] + '</button>').join('') + '</div></fieldset>' +
    '<fieldset><legend>情境（組合使用）</legend>' + SCEN.map(s => '<label><input type="checkbox" data-scen="' + s[0] + '"> ' + s[1] + '</label>').join('') +
    '<label for="jf">訓練工作結果</label><select id="jf" class="std-select" data-scen-sel="jobFail"><option value="none">成功完成</option><option value="rate">失敗：Edge 限流（Edge 路徑）／顯存不足（上傳路徑）</option><option value="oom">失敗：訓練中顯存不足</option></select></fieldset>' +
    '<fieldset><legend>外觀與文字長度</legend><label for="lg">語系（只換按鈕、步驟、狀態等介面文字，用來檢查長度）</label><select id="lg" class="std-select"><option value="zh-TW">zh-TW</option><option value="zh-CN">zh-CN</option><option value="en-US">en-US（最長）</option></select><label for="th">主題</label><select id="th" class="std-select"><option value="auto">跟隨系統</option><option value="light">淺色</option><option value="dark">深色</option></select><label for="sp">模擬速度</label><select id="sp" class="std-select"><option value="1">1×（真實節奏）</option><option value="4" selected>4×</option><option value="12">12×</option></select></fieldset>' +
    '<p class="note">所有資料、音訊與伺服器行為都是假的。校對、檢查與取消的規則是照規格實作的，狀態會真的影響按鈕。</p>';
  b.addEventListener('click', e => { const j = e.target.closest('[data-jump]'); if (j) { S.fresh = true; if (j.dataset.jump === 'home') S.fresh = false; go(j.dataset.jump); } });
  b.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.scen) { S.scen[el.dataset.scen] = el.checked; render(); }
    else if (el.dataset.scenSel) { S.scen[el.dataset.scenSel] = el.value; }
    else if (el.id === 'lg') { S.lang = el.value; document.documentElement.lang = el.value; render(); }
    else if (el.id === 'th') { try { el.value === 'auto' ? document.documentElement.removeAttribute('data-theme') : document.documentElement.setAttribute('data-theme', el.value); } catch (x) { } }
    else if (el.id === 'sp') { S.speed = +el.value; if (S.job && S.job.status === 'running') { clearInterval(S.tmr); S.tmr = setInterval(jobTick, 700 / S.speed); } }
  });
}
buildProto();
const h0 = location.hash.slice(1);
if (h0 && screens[h0]) { S.fresh = true; go(h0); } else { render(); }
})();
</script>
