# ERNeRF 模型配置檔案
# 說明：未列出的配置項將使用 schema.py 中定義的預設值

app:
  listenport: 8010
  max_session: 1
  # HTTPS 配置 - 支援瀏覽器錄音功能
  ssl_cert: ssl_certs/localhost.crt
  ssl_key: ssl_certs/localhost.key

model:
  type: ernerf  # wav2lip 僅限研究非商用 | musetalk | ultralight | ernerf
  avatar_id: ernerf_obama
  # ERNeRF 專屬配置
  ernerf:
    # ===== 必填：資料路徑 =====
    pose: ./data/avatars/ernerf_obama/data_kf.json
    au: ./data/avatars/ernerf_obama/au.csv
    workspace: ./data/avatars/ernerf_obama/
    ckpt: ./data/avatars/ernerf_obama/ngp_kf.pth
    # more config please refer to src/config/schema.py

tts:
  type: edgetts  # edgetts | fishtts | gpt-sovits | cosyvoice | indextts2 | xtts
  ref_file: zh-TW-HsiaoChenNeural

asr:
  mode: server  # 互動麥克風固定經 WebRTC 送到服務端
  type: whisper  # whisper | funasr
  model_size: base  # tiny | base | small | medium | large-v3
  language: zh  # zh | en | auto
  device: auto  # auto | cpu | cuda

llm:
  api_key: ${DASHSCOPE_API_KEY}
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen-plus
