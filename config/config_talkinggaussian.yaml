# TalkingGaussian 配置檔案
app:
  # 後端服務配置
  listenport: 8010
  listenhost: 0.0.0.0  # 0.0.0.0 允許外部訪問，127.0.0.1 僅本地
  max_session: 1
  
  # SSL/HTTPS 統一配置（一處控制，前後端自動適配）
  # ssl: true  啟用 HTTPS，支援遠端錄音
  # ssl: false 使用 HTTP，僅本地開發
  ssl: true
  ssl_cert: ssl_certs/localhost.crt
  ssl_key: ssl_certs/localhost.key
  
  # 前端開發伺服器配置
  web:  # 僅 Vite 開發伺服器（npm run dev）；正式由後端 listenport 同源提供
    port: 3000
    host: 127.0.0.1


model:
  type: talkinggaussian
  avatar_id: talkinggaussian_obama

  # TalkingGaussian
  talkinggaussian:
    source_path: data/avatars/talkinggaussian_obama/source
    model_path: data/avatars/talkinggaussian_obama/model
    bg_img: "white" # 背景配置: white(白色) | black(黑色) | /path/to/bg.jpg(完整路徑)

tts:
  type: edgetts  # edgetts | breezyvoice
  ref_file: zh-TW-HsiaoChenNeural

asr:
  mode: server  # 互動麥克風固定經 WebRTC 送到服務端
  type: whisper  # whisper | funasr
  model_size: base  # tiny | base | small | medium | large-v3
  language: zh  # zh | en | auto
  device: auto  # auto | cpu | cuda

llm:
  api_key: ${DASHSCOPE_API_KEY}  # 支援環境變數引用
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen-plus

audio:
  fps: 50
  sample_rate: 16000
  # 音訊視窗配置
  l: 10  # left
  m: 8   # middle  
  r: 10  # right

video:
  width: 450
  height: 450
  fps: 25

custom_video:
  config_path: ''
