# 預設服務配置：埠 / SSL / TTS / LLM。
# 數字人引擎、角色、Ollama 模型請在網頁「設定」裡選擇，不必再換 config_musetalk.yaml。
app:
  listenport: 8010
  max_session: 1
  
  # SSL/HTTPS 配置（可選，啟用後支援遠端錄音功能）
  ssl: true
  ssl_cert: ssl_certs/localhost.crt 
  ssl_key: ssl_certs/localhost.key

  web:
    port: 3000
    host: 0.0.0.0

model:
  # 啟動時若該角色素材齊全會預載；否則服務仍會啟動，到設定裡再選
  type: musetalk  # wav2lip 僅限研究非商用 | musetalk | ultralight | ernerf | talkinggaussian
  avatar_id: musetalk_avatar1
  # Low-latency conversation: 8 frames = 320ms at 25fps (was 640ms at 16).
  batch_size: 8
  model_path: ./models
  # 嘴型貼回：Lanczos + 適度銳化可減輕 256 口型放大後的模糊；可在設定頁調整
  mouth_sharpen: 0.5
  paste_interpolation: lanczos
  musetalk:
    bbox_shift: 0
    extra_margin: 10
    parsing_mode: jaw
    left_cheek_width: 90
    right_cheek_width: 90
    upper_boundary_ratio: 0.5
    expand: 1.5
    mask_blur_ratio: 0.05
    mouth_continuity: true
    mouth_continuity_idle_alignment: true
    opening_frames: 2
    avatar_transition: true
    settling_enabled: true
    settling_frames: 5
    settling_min_frames: 4
    settling_max_frames: 6
    phase_matching_enabled: true
    phase_temporal_penalty: 0.015
    micro_crossfade_enabled: true
    micro_crossfade_frames: 2
    micro_crossfade_fullframe_max_diff: 18.0
    gap_grace_frames: 1
  wav2lip:
    pad_top: 0
    pad_bottom: 10
    pad_left: 0
    pad_right: 0
  
  # ERNeRF 配置資訊參考
  # type: ernerf
  # ernerf:
  #   pose: data/data_kf.json
  #   au: data/au.csv
  #   torso_imgs: ""
  #   workspace: data/video
  #   ckpt: data/pretrained/ngp_kf.pth
  #   # 更多配置請參考 config_nerf.yaml

  # TalkingGaussian 配置資訊參考
  # type: talkinggaussian
  # talkinggaussian:
  #   source_path: data/Obama_test
  #   model_path: data/output/Obama
  #   bg_img: "white" # 背景配置: white(白色) | black(黑色) | /path/to/bg.jpg(完整路徑)
  # 更多配置請參考 config_talkinggaussian.yaml

# TTS 配置資訊，可以改對應的模型，建議edgetts
tts:
  type: edgetts  # edgetts | fishtts | gpt-sovits | cosyvoice | fun-cosyvoice3 | indextts2 | xtts
  mode: auto  # CosyVoice: auto | zero_shot | cross_lingual | instruct
  ref_file: zh-TW-HsiaoChenNeural  # 臺灣女聲（曉臻）；cosyvoice / fun-cosyvoice3 請改成本機 WAV 路徑
  tts_server: http://127.0.0.1:9880  # gpt-sovits 等；cosyvoice 系列套用時會改用 50000 並自動啟動
  model: ''
  language: Chinese
  speaker: Vivian
  instruct: ''
  device: auto
  edge_persistent_worker: true  # 重用 Edge 的本機 event loop，不是持久遠端連線
  edge_prefetch: true  # 第一片段出聲後最多預取下一段，降低片段間空窗

# ASR 配置資訊，可以改對應的模型，建議browser
asr:
  mode: server  # 互動麥克風固定經 WebRTC 送到服務端
  type: whisper  # whisper | funasr
  model_size: base
  language: zh  # zh | en | auto
  output_script: traditional-tw  # FunASR: traditional-tw | simplified
  device: auto  # auto | cpu | cuda
  # 輸入品質閘門：無效音訊或低可信轉寫不得觸發新的對話輪次。
  min_speech_ms: 450
  min_audio_rms: 0.003
  min_confidence: 0.35

# LLM：Ollama 或 llama.cpp，也可在網頁設定裡切換
llm:
  provider: ollama  # ollama | llamacpp
  api_key: ollama  # Ollama / llama-server 都不驗證，但不可為空
  base_url: http://localhost:11434/v1
  model: qwen3.5:4b
  llamacpp_dir: /home/oliver/llama
  llamacpp_host: 127.0.0.1
  llamacpp_port: 8080
  llamacpp_ctx: 8192          # 容納看板協定與最近10輪，避免超長 prompt 被拒絕
  llamacpp_threads: 0         # 0=自動用滿 CPU；有 CUDA 時主要靠 GPU
  max_tokens: 128             # 模型輸出 token 安全上限，會依回覆字數自動加緩衝，避免句中硬切
  response_max_chars: 120     # 每次回答要在這個字數內把話說完，不是多出來再切斷
  extra_body:
    reasoning_effort: "none"  # 僅 Ollama：關閉思考鏈，降低首字延遲
  response_router:
    enabled: true
    rule_first: true
    llm_fallback: true
    board_threshold: 3.0
    simple_threshold: 0.0
    classifier_max_tokens: 4
  board:
    enabled: true
    max_items: 8

# 回覆語音串流已通過 Edge TTS＋MuseTalk 單會話 SLO；跨引擎驗證完成前預設保留舊有路徑。
reply_streaming:
  enabled: false
  semantic_wait_seconds: 0.5  # 控制台可調；保留首音 P95 ≤ 2.5 秒的延遲預算

# 數字人舞台字幕顯示窗口；只影響舞台顯示，不限制模型生成長度
stage:
  caption_max_chars: 120

# VAD 服務端語音端點檢測：固定使用 Silero；WebRTC 負責傳輸，不負責判定語音
vad:
  enabled: true
  type: silero
  sample_rate: 16000
  frame_ms: 0  # Silero 固定 512 點 / 32ms
  threshold: 0.5  # silero 語音機率閾值，噪聲大就調高
  aggressiveness: 2  # 相容舊配置，不再使用
  device: cpu  # silero 專屬：cpu | cuda | auto
  model_path: ''  # silero 專屬：本地 silero_vad.jit/.onnx，留空自動載入
  use_onnx: false  # silero 專屬：用 onnxruntime 推理
  # Silero 端點檢測引數
  speech_start_ms: 100  # 連續多久算開口
  min_speech_ms: 250  # 太短的片段當噪聲丟掉
  min_silence_ms: 300  # 連續靜音多久算說完
  speech_pad_ms: 150  # 片段前後各留一點，避免吃字
  max_speech_ms: 15000  # 單段上限，0=不限制

# Audio 配置資訊，不要更改
audio:
  fps: 50
  sample_rate: 16000
  # 音影像對齊補償（毫秒）。嘴型由一段 200ms 的 mel 視窗生成，而視窗是從配對的
  # 音訊幀往後取，等效中心在 +100ms，所以嘴型會領先聲音。正值把音訊往前拉，
  # 用來治「聲音比嘴型慢」；覺得補過頭就往下調，0 = 完全不補償。
  # 有效範圍 -200 ~ 160（受 l=10 / r=10 限制），超過會被夾住。
  # 註：實測 100 對「聲音比嘴慢」無改善，已調回 0；該症狀另有原因。
  av_offset_ms: 0

# Video配置資訊，運用於ERNeRF和TalkingGaussian
video:
  width: 450
  height: 450
  fps: 25

# CustomVideo配置資訊
custom_video:
  config_path: ''
