[project]
name = "nova-avatar-wav2lip-research"
version = "0.1.0"
description = "Research-only Wav2Lip avatar integration for Nova Avatar"
requires-python = ">=3.10, <3.12"
license = { text = "Contains Wav2Lip-derived components subject to upstream non-commercial terms; see ../../../THIRD_PARTY_NOTICES.md" }
maintainers = [{ name = "HongXian0903" }]

dependencies = [
    # Wav2Lip 專用依賴
    "imageio>=2.31.0",
    "av>=10.0.0",
    "torch==2.5.0",
    "torchvision",
    "torchaudio",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = []

[tool.setuptools.package-data]
"*" = ["**/*"]
